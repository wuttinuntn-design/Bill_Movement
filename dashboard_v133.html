<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบติดตามสถานะบิล — Bill Movement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #F5F7FA; --panel: #FFFFFF; --panel-2: #F0F3F7; --line: #E1E7EE;
    --text: #16222E; --text-dim: #57697A; --text-faint: #8B99A8;
    --normal: #1E9E6B; --normal-dim: #E3F7EE;
    --anomaly: #D8483D; --anomaly-dim: #FBE6E4;
    --watch: #C98A1F; --watch-dim: #FBF0DC;
    --font-display: 'Space Grotesk', sans-serif;
    --font-ui: 'IBM Plex Sans Thai', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 18px 24px 70px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  header.top h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--text-dim); font-size: 13.5px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 500; font-family: var(--font-ui); }
  .btn:hover { border-color: var(--text-faint); }
  .btn:disabled, input:disabled, select:disabled { opacity: .4; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); }
  .status-line { font-size: 12.5px; color: var(--text-faint); padding: 2px 0 10px; min-height: 14px; }
  .status-line.error { color: var(--anomaly); }
  .status-line.ok { color: var(--normal); }

  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(96px, auto); gap: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 2px rgba(22,34,46,.05); }
  .tile-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .tile-head h2 { font-size: 13.5px; font-weight: 600; margin: 0; color: var(--text-dim); }
  .tile-head .note { font-size: 11px; color: var(--text-faint); white-space: nowrap; }

  .c1 { grid-column: span 1; } .c2 { grid-column: span 2; } .c4 { grid-column: span 4; }
  .r1 { grid-row: span 1; } .r2 { grid-row: span 2; }

  /* Hero tile */
  .hero { justify-content: center; align-items: center; background: linear-gradient(160deg, #FFFFFF 0%, var(--panel-2) 100%); }
  .hero-ring-wrap { position: relative; width: 168px; height: 168px; margin: 4px 0 14px; }
  .hero-ring-wrap svg { transform: rotate(-90deg); }
  .hero-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hero-num .pct { font-family: var(--font-display); font-size: 38px; font-weight: 700; line-height: 1; }
  .hero-num .lbl { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .hero-caption { text-align: center; font-size: 13px; color: var(--text-dim); }
  .hero-caption b { color: var(--text); }

  /* Flow pipeline */
  .flow-wrap { position: relative; width: 100%; overflow-x: auto; }
  .flow-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .flow-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .flow-legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .flow-stage-label { font-size: 11.5px; font-weight: 600; fill: var(--text); font-family: var(--font-ui); }
  .flow-stage-sub { font-size: 10px; fill: var(--text-faint); font-family: var(--font-mono); }
  .flow-stage-count { font-family: var(--font-display); font-weight: 700; }

  /* Number tiles */
  .num-tile .num { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }
  .num-tile .lbl { margin-top: 8px; color: var(--text-dim); font-size: 12.5px; }
  .num-tile.anomaly .num { color: var(--anomaly); }
  .num-tile.watch .num { color: var(--watch); }
  .num-tile.normal .num { color: var(--normal); }
  .num-tile.highlight { background: var(--anomaly-dim); border-color: var(--anomaly); }
  .num-tile.highlight .lbl { color: #E8A9A4; }

  /* Histogram */
  .hist-row { display: flex; align-items: flex-end; gap: 14px; height: 120px; padding-top: 10px; }
  .hist-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; }
  .hist-bar { width: 100%; border-radius: 6px 6px 3px 3px; min-height: 4px; }
  .hist-count { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
  .hist-label { font-size: 11px; color: var(--text-faint); text-align: center; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 4px; color: var(--text-faint); font-weight: 500; font-size: 11px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { font-family: var(--font-mono); text-align: right; }
  .table-scroll { overflow-y: auto; flex: 1; margin: 0 -4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge.red { background: var(--anomaly-dim); color: var(--anomaly); }
  .badge.amber { background: var(--watch-dim); color: var(--watch); }
  .badge.teal { background: var(--normal-dim); color: var(--normal); }

  .status-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; gap: 10px; }
  .status-row .name { font-size: 12.5px; flex: 1; }
  .status-row .track { width: 70px; }
  .status-row .count { font-family: var(--font-mono); font-size: 12.5px; width: 34px; text-align: right; color: var(--text-dim); }
  .bar-track { background: var(--panel-2); border-radius: 4px; height: 5px; width: 100%; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .sub { font-size: 10.5px; color: var(--text-faint); margin-top: 1px; font-family: var(--font-mono); }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  select, input[type=text] { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 7px 10px; border-radius: 7px; font-size: 13px; font-family: var(--font-ui); }
  input[type=text] { min-width: 200px; }

  .focus-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .focus-summary .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; }
  .focus-summary .chip b { font-family: var(--font-mono); font-size: 15px; display: block; }
  .focus-empty { padding: 24px; text-align: center; color: var(--text-faint); font-size: 13px; }

  .timeline { display: flex; flex-direction: column; }
  .tl-step { display: flex; gap: 14px; }
  .tl-rail { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--normal); border: 2px solid var(--panel); box-shadow: 0 0 0 2px var(--line); flex-shrink: 0; margin-top: 4px; }
  .tl-dot.abnormal { background: var(--anomaly); }
  .tl-line { flex: 1; width: 2px; background: var(--line); min-height: 24px; }
  .tl-body { padding-bottom: 18px; flex: 1; }
  .tl-status { font-weight: 600; font-size: 13.5px; }
  .tl-meta { font-size: 11.5px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 2px; }
  .tl-duration { font-size: 12px; margin-top: 4px; color: var(--text-dim); }
  .tl-duration.abnormal { color: var(--anomaly); font-weight: 600; }
  .history-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .history-summary .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; }

  /* ---- Bill history / drill-down modal — v92 redesign: scan verdict first, then compare times, then timeline ---- */
  .bh-wrap { display: flex; flex-direction: column; gap: 14px; }
  .bh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; font-size: 12px; color: var(--text-faint); font-family: var(--font-mono); }
  .bh-meta b { color: var(--text-dim); font-weight: 600; font-family: var(--font-ui); }
  .bh-meta .sep { color: var(--line); }

  .bh-hero { border-radius: 12px; padding: 13px 16px; border: 1.5px solid var(--line); background: var(--panel-2); }
  .bh-hero.red { background: var(--anomaly-dim); border-color: var(--anomaly); }
  .bh-hero.amber { background: var(--watch-dim); border-color: var(--watch); }
  .bh-hero.normal { background: var(--normal-dim); border-color: var(--normal); }
  .bh-hero-top { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 700; }
  .bh-hero.red .bh-hero-top { color: var(--anomaly); }
  .bh-hero.amber .bh-hero-top { color: var(--watch); }
  .bh-hero.normal .bh-hero-top { color: var(--normal); }
  .bh-hero-sub { margin-top: 5px; font-size: 13px; color: var(--text); line-height: 1.55; }
  .bh-hero-sub b { font-family: var(--font-mono); }

  .bh-compare { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .bh-compare-node { flex: 1; min-width: 0; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; }
  .bh-compare-node + .bh-compare-node { border-left: 1px dashed var(--line); }
  .bh-compare-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .bh-compare-value { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bh-compare-node.now.red { background: var(--anomaly-dim); }
  .bh-compare-node.now.red .bh-compare-value { color: var(--anomaly); }
  .bh-compare-node.now.normal { background: var(--normal-dim); }
  .bh-compare-node.now.normal .bh-compare-value { color: var(--normal); }
  .bh-compare-caption { font-size: 11.5px; color: var(--text-faint); }

  .bh-details { border: 1px solid var(--line); border-radius: 10px; }
  .bh-details summary { cursor: pointer; padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-dim); list-style: none; display: flex; align-items: center; gap: 7px; }
  .bh-details summary::-webkit-details-marker { display: none; }
  .bh-details summary::before { content: '▸'; font-size: 10px; color: var(--text-faint); transition: transform .12s ease; display: inline-block; }
  .bh-details[open] summary::before { transform: rotate(90deg); }
  .bh-details-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--text-dim); }
  .bh-details-body .row { display: flex; gap: 6px; align-items: flex-start; }
  .bh-details-body b { font-family: var(--font-mono); color: var(--text); font-weight: 600; }

  .bh-timeline-head { font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin: 0 0 2px; }
  .tl-step.current .tl-status { display: flex; align-items: center; gap: 7px; }
  .tl-step.current .tl-status::after { content: 'ล่าสุด'; font-size: 10px; font-weight: 700; color: var(--panel); background: var(--text-dim); border-radius: 5px; padding: 1px 6px; letter-spacing: .02em; }
  .tl-step.current.abnormal .tl-status::after { background: var(--anomaly); }
  .tl-step.current:not(.abnormal) .tl-status::after { content: 'สถานะปัจจุบัน'; background: var(--normal); }

  .clickable-num { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .bill-chip-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0; }
  .bill-chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: var(--font-mono); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .o00-subbreak-list { margin-top: 8px; }
  .o00-subbreak-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px; border-top: 1px dashed var(--line); font-size: 13px; cursor: pointer; }
  .o00-subbreak-row:first-child { border-top: none; }
  .o00-subbreak-row:hover { background: var(--panel-2); }
  .o00-subbreak-name { font-weight: 600; }
  .o00-subbreak-code { font-weight: 400; font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .o00-subbreak-count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: #B5651D; font-weight: 700; font-size: 12.5px; }
  .o00-subbreak-bills { padding: 2px 4px 10px; }
  .bill-chip:hover { border-color: var(--normal); }
  .bill-chip .dur { color: var(--text-faint); font-size: 11px; }
  .bill-chip.abnormal { border-color: var(--anomaly); color: var(--anomaly); }
  .bill-modal-overlay { position: fixed; inset: 0; background: rgba(15,22,30,.55); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 24px; }
  .bill-modal-overlay.hidden { display: none; }
  .bill-modal { background: var(--panel); border-radius: 14px; max-width: 760px; width: 100%; max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .bill-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); font-size: 14.5px; font-weight: 700; font-family: var(--font-mono); }
  .bill-modal-body { padding: 16px 20px 20px; overflow-y: auto; }
  .drilldown-head { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); margin-top: 10px; font-size: 13px; font-weight: 600; }
  .drilldown-close { font-size: 12px; color: var(--text-faint); cursor: pointer; font-weight: 400; }

  /* ===== รายชื่อ DC แบบ band chip (แย่สุดอยู่บน เห็นครบทุกสาขาในหน้าเดียว) ===== */
  .o00-bands { display: flex; flex-direction: column; gap: 2px; animation: o00FadeIn .18s ease; }
  @keyframes o00FadeIn { from { opacity: .35; } to { opacity: 1; } }
  .o00-band-row { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: start; padding: 6px 0; border-top: 1px dashed var(--line); }
  .o00-band-row:first-child { border-top: none; padding-top: 2px; }
  .o00-band-label { display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text-dim); line-height: 1.3; padding-top: 2px; }
  .o00-band-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 3px; }
  .o00-band-count { display: block; color: var(--text-faint); font-weight: 400; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 10.5px; margin-top: 1px; }
  .o00-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 6px; }

  .o00-chip { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px 7px; background: var(--panel); cursor: pointer; transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease; }
  .o00-chip:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(22,34,46,.12); }
  .o00-chip-name { font-size: 11.5px; font-weight: 600; line-height: 1.25; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; }
  .o00-chip-nums { font-variant-numeric: tabular-nums; margin-top: 2px; }
  .o00-chip-big { display: block; font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .o00-chip-created { font-size: 9.5px; opacity: .7; margin-top: 1px; }
  .o00-chip-subhint { font-size: 9.5px; font-weight: 600; color: #B5651D; opacity: .9; margin-top: 3px; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .o00-chip.lv3 .o00-chip-subhint { color: #FFE08A; }
  .o00-chip-rank { position: absolute; top: 5px; right: 6px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 10px; font-weight: 700; opacity: .45; }
  .o00-chip-iconrow { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  .o00-icnum { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; cursor: pointer; opacity: .8; }
  .o00-icnum:hover { opacity: 1; }
  .o00-icnum .ic { width: 12px; height: 12px; flex: none; margin-right: 0; }

  /* โทนสีตามความรุนแรง: แย่สุด = แดงทึบ -> ดีสุด = น้ำเงินทึบ */
  .o00-chip.lv3 { background: #B8514A; border-color: #A4443E; color: #fff; }
  .o00-chip.lv2 { background: #FBF0DC; border-color: #EBD3A4; color: #7A5410; }
  .o00-chip.lv1 { background: var(--panel); border-color: #E1E7EE; color: var(--text); }
  .o00-chip.lv0 { background: #EAF2FA; border-color: #BFD6EA; color: #2F5C80; }
  /* v87: สาขาที่ waiting=0 ด้วย (ไม่ใช่แค่ stuck=0) คือเคลียร์หมดจริงๆ ไม่เหลือบิลรออะไรเลย
     ให้ต่างจากสาขาที่แค่ "รอรอบปกติ" อยู่ (waiting > 0) เพื่อไม่ให้ดูกลืนเป็นกลุ่มเดียวกัน */
  .o00-chip.lv0.o00-perfect { background: #E3F5EC; border-color: #A9DDC0; color: #1E6B45; }
  .o00-chip-perfect-badge { margin-right: 4px; display: inline-flex; vertical-align: -2px; }
  .o00-chip-perfect-badge .ic { width: 12px; height: 12px; stroke: #1E9E6B; margin-right: 0; vertical-align: baseline; }

  .o00-pills { display: flex; gap: 6px; background: var(--panel-2); border-radius: 10px; padding: 4px; }
  .o00-pill { border: none; background: none; padding: 7px 16px; border-radius: 8px; font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--text-dim); cursor: pointer; transition: background .12s ease, color .12s ease, box-shadow .12s ease; }
  .o00-pill:hover { color: var(--text); }
  .o00-pill.active { background: var(--normal); color: #FFFFFF; font-weight: 700; box-shadow: 0 2px 6px rgba(30,158,107,.32); }
  .o00-pill.active:hover { color: #FFFFFF; }

  .o00-filterbar { margin-bottom: 8px; }
  .o00-statbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .o00-stat { display: inline-flex; align-items: center; gap: 6px; }
  .o00-stat b { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--text); line-height: 1; }
  .o00-stat i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .o00-stat.right { margin-left: auto; color: var(--text-faint); }
  .o00-sep { width: 1px; align-self: stretch; background: var(--line); }

  .matrix-table { border-collapse: collapse; font-size: 11.5px; }
  .matrix-table th, .matrix-table td { padding: 5px 8px; text-align: center; white-space: nowrap; border: 1px solid var(--line); }
  .matrix-table th.row-label, .matrix-table td.row-label { text-align: left; position: sticky; left: 0; background: var(--panel); font-weight: 500; }
  .matrix-table th { background: var(--panel-2); font-weight: 600; color: var(--text-dim); font-size: 10.5px; }
  .matrix-cell { font-family: var(--font-mono); }

  .empty { grid-column: span 4; text-align: center; color: var(--text-dim); padding: 60px 20px; border: 1px dashed var(--line); border-radius: 14px; }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* Tabs */
  .tab-btn-top { background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 16px; font-family: var(--font-ui); font-size: 13.5px; font-weight: 500; color: var(--text-dim); cursor: pointer; transition: background .12s ease, color .12s ease, border-color .12s ease, box-shadow .12s ease; }
  .tab-btn-top:hover { border-color: var(--text-faint); color: var(--text); }
  .tab-btn-top.active { color: #FFFFFF; border-color: var(--normal); background: var(--normal); font-weight: 700; box-shadow: 0 2px 8px rgba(30,158,107,.32); }
  .tab-btn-top.active:hover { color: #FFFFFF; }
  .tab-panel.hidden { display: none; }

  /* Upload panel */
  .upload-panel.show { display: block; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 28px 20px; text-align: center;
    cursor: pointer; transition: border-color .15s ease, background .15s ease; display: block;
  }
  .drop:hover, .drop.drag { border-color: var(--normal); background: var(--normal-dim); }
  .drop input { display: none; }
  .drop .icon { font-size: 26px; margin-bottom: 8px; }
  .drop .main { font-weight: 600; font-size: 14px; }
  .drop .hint { color: var(--text-faint); font-size: 12px; margin-top: 4px; }

  .upload-log { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .u-card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--text-faint); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; }
  .u-card.pending { border-left-color: var(--watch); }
  .u-card.ok { border-left-color: var(--normal); }
  .u-card.error { border-left-color: var(--anomaly); }
  .u-card .file { font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
  .u-card .status-text { color: var(--text-dim); font-size: 12px; }
  .u-card.error .status-text { color: var(--anomaly); }
  .u-stats { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
  .u-chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 11.5px; font-family: var(--font-mono); color: var(--text-dim); }
  .u-chip b { font-weight: 600; }

  .u-spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--watch);
    border-radius: 50%; animation: uspin .7s linear infinite; flex-shrink: 0;
  }
  @keyframes uspin { to { transform: rotate(360deg); } }

  .upload-summary {
    display: none; margin-top: 14px; background: var(--normal-dim); border: 1px solid var(--normal);
    border-radius: 10px; padding: 14px 16px; align-items: center; gap: 10px;
  }
  .upload-summary.show { display: flex; }
  .upload-summary .big-check { font-size: 20px; }
  .upload-summary .text b { display: block; font-size: 13.5px; color: var(--normal); }
  .upload-summary .text span { font-size: 12px; color: var(--text-dim); }

  footer.note { margin-top: 24px; color: var(--text-faint); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); padding-top: 16px; }

  @media (max-width: 980px) {
    .bento { grid-template-columns: repeat(2, 1fr); }
    .c2, .c4 { grid-column: span 2; }
    .hero { grid-row: span 1; }
    .o00-chips { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
  .loading-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .loading-overlay.show { opacity: 1; pointer-events: all; }
  .loading-box { display: flex; flex-direction: column; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px 32px; box-shadow: 0 8px 30px rgba(22,34,46,.12); }
  .loading-spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--normal); border-radius: 50%; animation: loadspin .7s linear infinite; }
  .loading-text { font-size: 13.5px; color: var(--text-dim); font-weight: 500; }
  @keyframes loadspin { to { transform: rotate(360deg); } }
  .ic { vertical-align: -3px; margin-right: 5px; flex-shrink: 0; }
  .ic-dot { vertical-align: -1px; margin-right: 4px; flex-shrink: 0; }
  .tile-head h2 { display: flex; align-items: center; gap: 8px; }
  .tile-head h2 .ic { margin-right: 0; width: 16px; height: 16px; color: var(--text-faint); }
  .tab-btn-top .ic, .btn .ic { color: currentColor; }
  .drop .icon svg { width: 30px; height: 30px; stroke-width: 1.6; color: var(--text-faint); }
  .upload-summary .big-check svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div class="loading-text">กำลังโหลดข้อมูล...</div>
  </div>
</div>
<div id="billModalOverlay" class="bill-modal-overlay hidden">
  <div class="bill-modal">
    <div class="bill-modal-head">
      <span id="billModalTitle">Timeline บิล</span>
      <span class="drilldown-close" id="billModalClose">✕ ปิด</span>
    </div>
    <div class="bill-modal-body" id="billModalResult"></div>
  </div>
</div>
<div id="reportModalOverlay" class="bill-modal-overlay hidden">
  <div class="bill-modal">
    <div class="bill-modal-head">
      <span>สรุปรายงาน — คัดลอกส่งกลุ่มไลน์</span>
      <span class="drilldown-close" id="reportModalClose">✕ ปิด</span>
    </div>
    <div class="bill-modal-body">
      <textarea id="reportModalText" readonly style="width:100%;min-height:340px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;background:var(--panel-2);color:var(--text)"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
        <span id="reportCopyStatus" style="font-size:12.5px;color:var(--normal);align-self:center"></span>
        <button class="btn" id="reportCopyBtn">คัดลอกข้อความ</button>
      </div>
    </div>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>ระบบติดตามสถานะบิล — Bill Movement</h1>
      <p id="headerDateRange"></p>
    </div>
    <div class="controls">
      <button class="tab-btn-top" id="tabUploadBtn"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>อัปโหลด</button>
      <button class="tab-btn-top active" id="tabDisplayBtn"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/><path d="M3 20h18"/></svg>แสดงผล</button>
      <button class="btn" id="refreshBtn"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.6"/><path d="M4 13a8 8 0 0 0 14.9 3.6"/><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/></svg>รีเฟรชข้อมูล</button>
    </div>
  </header>

  <div class="tab-panel hidden" id="tabUpload">
    <div class="upload-panel show" id="uploadPanel">
      <label class="drop" id="dropZone">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
        <div class="main">คลิกหรือลากไฟล์ Excel มาวางที่นี่</div>
        <div class="hint">รองรับ .xlsx — เลือกได้ทีละหลายไฟล์ — ระบบกันข้อมูลซ้ำให้อัตโนมัติ</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
      </label>
      <div class="upload-log" id="uploadLog"></div>
      <div class="upload-summary" id="uploadSummaryBanner">
        <div class="big-check"><svg viewBox="0 0 24 24" fill="none" stroke="var(--normal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.3l2.5 2.5 5.5-6"/></svg></div>
        <div class="text"><b>เก็บข้อมูลครบแล้ว</b><span id="uploadSummaryText"></span></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="tabDisplay">
    <div class="status-line" id="statusLine"></div>

    <div class="bento" id="bento">
      <div class="empty">
        <strong>กำลังโหลดข้อมูล...</strong>
        ถ้าไม่ขึ้นภายในไม่กี่วินาที ลองกด "รีเฟรชข้อมูล"
      </div>
    </div>

    <footer class="note" id="footerNote"></footer>
  </div>
</div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyM_5kmIWH5jnAiU_BfYzgSoXRcoxLOcbPieqjTrWxSk34m7NYUfpHnEtPIfxORbWDhJA/exec';
let lastData = null;

// ---------- Modern icon set (inline SVG, currentColor stroke) ----------
const ICONS = {
  search: '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.4-4.4"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.3l2.3 2.3 4.7-5"/></svg>',
  warn: '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 4 2.9 18a1.6 1.6 0 0 0 1.4 2.4h15.4a1.6 1.6 0 0 0 1.4-2.4L13.4 4a1.6 1.6 0 0 0-2.8 0Z"/><path d="M12 9.5v4"/><circle cx="12" cy="16.7" r="0.15" fill="currentColor" stroke="none"/></svg>',
  close: '<svg class="ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M5 5l14 14"/><path d="M19 5 5 19"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>',
  repeat: '<svg class="ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  grid: '<svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>',
  fileSearch: '<svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6"/><path d="M13 3l5 5"/><path d="M13 3v5h5"/><circle cx="14.5" cy="16.5" r="2.5"/><path d="M17 19l2 2"/></svg>',
  package: '<svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  building: '<svg class="ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.2"/><path d="M9 21v-4.5h6V21"/><path d="M8 7.5h1M8 11.5h1M15 7.5h1M15 11.5h1"/></svg>',
  pin: '<svg class="ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21S5 14.7 5 9.8A7 7 0 0 1 19 9.8C19 14.7 12 21 12 21Z"/><circle cx="12" cy="9.6" r="2.3"/></svg>',
  dot: function (color) { return '<svg class="ic-dot" viewBox="0 0 24 24" width="9" height="9"><circle cx="12" cy="12" r="10" fill="' + color + '"/></svg>'; },
  clipboard: '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3.5" width="10" height="4" rx="1"/><rect x="5" y="5.5" width="14" height="16" rx="2"/><path d="M9 12.5h6M9 16.5h6"/></svg>'
};

function setStatus(msg, kind) {
  const el = document.getElementById('statusLine');
  el.textContent = msg;
  el.className = 'status-line' + (kind ? ' ' + kind : '');
}

document.getElementById('refreshBtn').addEventListener('click', function () { o00CacheClearAll(); lastCohortWeekly = null; lastCohortDaily = null; cohortWeekIdx = null; cohortDayIdx = null; loadDashboard(); });

function jsonp(url) {
  return new Promise(function (resolve, reject) {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const script = document.createElement('script');
    const timeout = setTimeout(function () { cleanup(); reject(new Error('หมดเวลารอผลลัพธ์ (90 วิ) — ข้อมูลอาจเยอะเกินไปหรือ GAS ช้าผิดปกติ')); }, 90000);
    function cleanup() { clearTimeout(timeout); delete window[cbName]; script.remove(); }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); reject(new Error('โหลดสคริปต์ไม่สำเร็จ')); };
    script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cbName;
    document.body.appendChild(script);
  });
}

function showLoadingOverlay(text) {
  const el = document.getElementById('loadingOverlay');
  if (text) el.querySelector('.loading-text').textContent = text;
  el.classList.add('show');
}
function hideLoadingOverlay() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

async function loadDashboard() {
  setStatus('กำลังโหลดข้อมูล...');
  showLoadingOverlay('กำลังโหลดข้อมูล...');
  try {
    const json = await jsonp(WEBAPP_URL + '?action=getDashboard');
    if (!json.ok) throw new Error(json.error || 'unknown error');
    lastData = json.data;
    render(lastData);
    setStatus('โหลดข้อมูลสำเร็จ', 'ok');
  } catch (err) {
    setStatus('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
  } finally {
    hideLoadingOverlay();
  }
}

let lastCutoffData = null;
let lastCohortWeekly = null;
let lastCohortDaily = null;
let cohortViewMode = 'weekly'; // v133: เปิดมาเป็นรายสัปดาห์ก่อน
let cohortBillType = '';
let cohortFocusMode = 'all'; // v131: all | dc | sub | points
let cohortWeekIdx = null; // null = ยังไม่กำหนด -> ใช้สัปดาห์ล่าสุดเป็นค่าเริ่มต้น
let cohortDayIdx = null;

async function doCutoffStats() {
  const container = document.getElementById('cutoffStatsResult');
  const btn = document.getElementById('cutoffStatsBtn');
  btn.disabled = true; btn.textContent = 'กำลังวิเคราะห์...';
  container.innerHTML = '<div class="focus-empty">กำลังสแกนประวัติทั้งหมด รอสักครู่...</div>';
  showLoadingOverlay('กำลังวิเคราะห์ทุกสาขา...');
  try {
    const json = await jsonp(WEBAPP_URL + '?action=getOriginCutoffStats');
    if (!json.ok) throw new Error(json.error || 'unknown error');
    renderCutoffStats(json.data);
  } catch (err) {
    container.innerHTML = '<div class="focus-empty">วิเคราะห์ไม่สำเร็จ: ' + esc(err.message) + '</div>';
  } finally {
    btn.disabled = false; btn.innerHTML = ICONS.search + ' วิเคราะห์ทุกสาขา';
    hideLoadingOverlay();
  }
}

function renderCutoffStats(data) {
  lastCutoffData = data;
  const container = document.getElementById('cutoffStatsResult');
  const list = data.dcStats;
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="focus-empty">ยังไม่มีข้อมูลพอวิเคราะห์ (ต้องมี "เวลาสร้างบิล" ใน RawLog และข้อมูล cutoff ใน Master ที่ตรงกัน — บิลที่ import ก่อนเพิ่มคอลัมน์นี้จะไม่ถูกนับ)</div>';
    return;
  }
  let html = '<div class="table-scroll" style="max-height:420px"><table><thead><tr>' +
    '<th>DC ต้นทาง</th><th class="num">' + ICONS.check + ' ปกติ</th><th class="num">' + ICONS.warn + ' ผิดปกติ</th><th class="num">รวม</th><th class="num">% ปกติ</th><th>สัดส่วน</th>' +
    '</tr></thead><tbody>';
  list.forEach(function (d, di) {
    const color = d.normalPct >= 80 ? 'var(--normal)' : d.normalPct >= 50 ? 'var(--watch)' : 'var(--anomaly)';
    html += '<tr>' +
      '<td>' + esc(dcDisplayName(d.dc)) + '</td>' +
      '<td class="num">' + (d.normal ? '<span class="clickable-num" data-dc-idx="' + di + '" data-cat="normal">' + d.normal.toLocaleString('th-TH') + '</span>' : '0') + '</td>' +
      '<td class="num">' + (d.abnormal ? '<span class="badge red clickable-num" data-dc-idx="' + di + '" data-cat="abnormal">' + d.abnormal.toLocaleString('th-TH') + '</span>' +
        (d.stillStuck ? '<div class="sub">ยังค้างอยู่ตอนนี้ ' + d.stillStuck + '</div>' : '') : '—') + '</td>' +
      '<td class="num"><span class="clickable-num" data-dc-idx="' + di + '" data-cat="all">' + d.total.toLocaleString('th-TH') + '</span></td>' +
      '<td class="num" style="color:' + color + ';font-weight:600">' + d.normalPct + '%</td>' +
      '<td style="width:120px"><div class="bar-track"><div class="bar-fill" style="width:' + d.normalPct + '%;background:' + color + '"></div></div></td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="font-size:11.5px;color:var(--text-faint);margin-top:8px">วิเคราะห์เมื่อ: ' + new Date(data.generatedAt).toLocaleString('th-TH') +
    (data.skippedNoData ? ' — ข้าม ' + data.skippedNoData.toLocaleString('th-TH') + ' บิลที่ไม่มีข้อมูลพอคำนวณ (เวลาสร้างบิลหรือ cutoff ของ DC นั้นไม่มีในระบบ)' : '') + '</div>';
  html += '<div id="cutoffDrilldown"></div>';
  container.innerHTML = html;

  container.querySelectorAll('.clickable-num').forEach(function (el) {
    el.addEventListener('click', function () {
      const di = parseInt(el.getAttribute('data-dc-idx'), 10);
      const cat = el.getAttribute('data-cat');
      showCutoffDrilldown(lastCutoffData.dcStats[di], cat);
    });
  });
}

function showCutoffDrilldown(dcEntry, cat) {
  const bills = cat === 'all' ? dcEntry.bills : dcEntry.bills.filter(function (b) { return b.category === cat; });
  const catLabel = cat === 'all' ? 'ทั้งหมด' : cat === 'normal' ? (ICONS.check + ' ปกติ') : (ICONS.warn + ' ผิดปกติ');
  let html = '<div class="drilldown-head"><span>รายการบิล — ' + esc(dcDisplayName(dcEntry.dc)) + ' (' + catLabel + ', ' + bills.length + ' บิล)</span>' +
    '<span class="drilldown-close" id="closeCutoffDrilldown">' + ICONS.close + ' ปิด</span></div>';
  html += '<div class="bill-chip-list">' + bills.map(function (b) {
    return '<span class="bill-chip' + (b.category === 'abnormal' ? ' abnormal' : '') + '" data-bill="' + esc(b.bill) + '">' +
      esc(b.bill) + (b.note ? '<span class="dur">' + esc(b.note) + '</span>' : '') + '</span>';
  }).join('') + '</div>';
  document.getElementById('cutoffDrilldown').innerHTML = html;

  document.getElementById('closeCutoffDrilldown').addEventListener('click', function () {
    document.getElementById('cutoffDrilldown').innerHTML = '';
  });
  document.querySelectorAll('#cutoffDrilldown .bill-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      const bill = chip.getAttribute('data-bill');
      openBillModal(bill);
    });
  });
}

async function doShowMatrixMasterInfo() {
  const dc = document.getElementById('matrixDC').value;
  const infoEl = document.getElementById('matrixMasterInfo');
  if (!dc) { infoEl.innerHTML = ''; return; }
  infoEl.textContent = 'กำลังโหลดข้อมูล cutoff...';
  try {
    const json = await jsonp(WEBAPP_URL + '?action=getMasterInfo&dc=' + encodeURIComponent(dc));
    if (!json.ok || !json.data.found) { infoEl.textContent = 'ไม่พบข้อมูล cutoff ของสาขานี้ใน Master'; return; }
    const d = json.data;
    infoEl.innerHTML =
      '<b>' + esc(d.name) + '</b> — ' +
      'NORMAL: cutoff สร้างบิล <b class="mono">' + esc(d.cutoffAB || '—') + '</b> น. / ปล่อยรถ <b class="mono">' + esc(d.releaseAB || '—') + '</b> น. &nbsp;|&nbsp; ' +
      'COLDCHAIN: cutoff สร้างบิล <b class="mono">' + esc(d.cutoffCC || '—') + '</b> น. / ปล่อยรถ <b class="mono">' + esc(d.releaseCC || '—') + '</b> น.';
  } catch (err) {
    infoEl.textContent = 'โหลดข้อมูล cutoff ไม่สำเร็จ: ' + err.message;
  }
}

let lastOrigin00Data = null;
let o00CurrentBillType = '';
let o00CurrentMode = 'all';
let preloadedOrigin00 = null; // ยิงคำขอ "เมื่อวาน/รวม" ไปพร้อมกับ getDashboard ตั้งแต่ต้น ไม่ต้องรอให้โหลดหน้าหลักเสร็จก่อนค่อยเริ่ม (ลดเวลารวมลงเกือบครึ่ง)

// v89: ข้อมูลจริงอัปเดตแค่ ~4 รอบ/วัน (คนอัปโหลด Excel เอง) — ไม่จำเป็นต้องรอ API ทุกครั้งที่สลับตัวกรอง
// เก็บผลลัพธ์แต่ละชุดตัวกรองไว้ใน localStorage (ข้ามรอดแม้ปิดหน้าเว็บ/รีเฟรช ไม่ใช่แค่ในแท็บเดียว)
// แล้วใช้ stale-while-revalidate: มีของเก่าอยู่ก็โชว์ทันทีก่อน ไม่บล็อกรอ แล้วค่อยแอบไปเช็คของใหม่
// เบื้องหลังเงียบๆ อัปเดตทับให้ถ้าเปลี่ยนจริง (ผู้ใช้จะไม่เห็นจอโหลดเลยหลังจากเคยเปิดตัวกรองนั้นมาก่อน)
const ORIGIN00_LS_PREFIX = 'o00_cache_v1_';
function o00CacheGet(url) {
  try {
    const raw = localStorage.getItem(ORIGIN00_LS_PREFIX + url);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; /* private mode หรือ localStorage ใช้ไม่ได้ ก็แค่ไม่มีแคช ไม่กระทบการทำงานหลัก */ }
}
function o00CacheSet(url, data) {
  try { localStorage.setItem(ORIGIN00_LS_PREFIX + url, JSON.stringify(data)); } catch (e) { /* โควต้าเต็มหรือ private mode ก็ไม่เป็นไร แค่ไม่ได้แคชรอบนี้ */ }
}
function o00CacheClearAll() {
  try {
    Object.keys(localStorage).filter(function (k) { return k.indexOf(ORIGIN00_LS_PREFIX) === 0; })
      .forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) { /* ไม่เป็นไร */ }
}

let o00RequestSeq = 0; // v98: กันปัญหา request แข่งกัน (race condition) เวลาคลิกสลับแท็บเร็วๆ

async function doOrigin00Snapshot() {
  const mySeq = ++o00RequestSeq; // เลขคำขอของรอบนี้ — ใช้เช็คตอนจบว่ายังเป็นคำขอล่าสุดจริงไหม
  const container = document.getElementById('origin00Result');
  const billType = typeof o00CurrentBillType !== 'undefined' ? o00CurrentBillType : '';
  const dateVal = document.getElementById('o00Date') ? document.getElementById('o00Date').value : '';
  const mode = typeof o00CurrentMode !== 'undefined' ? o00CurrentMode : 'cohort';
  let url = WEBAPP_URL + '?action=getOrigin00Snapshot&mode=' + encodeURIComponent(mode);
  if (billType) url += '&billType=' + encodeURIComponent(billType);
  if (dateVal && mode !== 'all') url += '&date=' + encodeURIComponent(dateVal);

  // มีของเก่าอยู่แล้ว — โชว์ทันทีเลย ไม่ต้องรอ ส่วนของใหม่ค่อยไปเช็คเบื้องหลังแบบเงียบๆ ด้านล่าง
  // v97: ไม่ใช้ full-page loading overlay อีกต่อไปตอนสลับแท็บ (รวม/NORMAL/COLDCHAIN) เพราะ
  // เบลอทั้งหน้าจอทุกครั้งที่สลับดูกระตุก เปลี่ยนเป็นโชว์ข้อความโหลดแค่ในกล่องนี้กล่องเดียวแทน
  const cachedData = o00CacheGet(url);
  if (cachedData) {
    renderOrigin00(cachedData);
  } else {
    container.innerHTML = '<div class="focus-empty">กำลังโหลด...</div>';
  }

  try {
    let json;
    if (preloadedOrigin00 && billType === '' && mode === 'cohort' && dateVal === yesterdayISO()) {
      // ตรงกับ filter เริ่มต้นพอดี — ใช้คำขอที่ยิงไปพร้อมกับหน้าหลักตั้งแต่ต้น แทนการยิงซ้ำ
      json = await preloadedOrigin00;
    }
    preloadedOrigin00 = null; // ใช้ได้ครั้งเดียว ครั้งถัดไปยิงสดตามตัวกรองจริง

    if (!json) json = await jsonp(url);
    if (mySeq !== o00RequestSeq) return; // v98: มีคำขอใหม่กว่าแซงไปแล้วระหว่างรอ — ทิ้งผลลัพธ์นี้ ไม่เอามาโชว์ทับของถูกต้อง
    if (!json.ok) throw new Error(json.error || 'unknown error');
    o00CacheSet(url, json.data);
    renderOrigin00(json.data); // อัปเดตทับของเก่าเงียบๆ (ถ้าตัวเลขเหมือนเดิม ผู้ใช้จะไม่รู้สึกอะไรเลย)
  } catch (err) {
    if (mySeq !== o00RequestSeq) return; // v98: คำขอเก่าที่ถูกแซงไปแล้ว ไม่ต้องโชว์ error ทับของใหม่
    // ถ้ามีของเก่าจาก cache แสดงอยู่แล้ว โหลดสดพังก็ปล่อยของเก่าไว้เฉยๆ ไม่ต้องไปทับด้วย error
    if (!cachedData) container.innerHTML = '<div class="focus-empty">โหลดไม่สำเร็จ: ' + esc(err.message) + '</div>';
  }
}

let lastOrigin00SortedList = [];

function renderOrigin00(data) {
  lastOrigin00Data = data;
  const container = document.getElementById('origin00Result');
  let list = data.dcList; // v84: ไม่กรอง total>0 อีกแล้ว — ต้องเห็นครบทุกสาขา รวมสาขาที่ตกค้าง 0
  if (list.length === 0) {
    container.innerHTML = '<div class="focus-empty">ไม่มีบิลค้างสถานะ 00 ตรงเงื่อนไขนี้เลย</div>';
    return;
  }
  const sortBy = document.getElementById('o00Sort') ? document.getElementById('o00Sort').value : 'stuck';
  list = list.slice().sort(function (a, b) {
    if (sortBy === 'name') return a.dc.localeCompare(b.dc, 'th');
    if (sortBy === 'waiting') return b.waiting - a.waiting;
    if (sortBy === 'total') return b.total - a.total;
    return b.stuck - a.stuck;
  });
  lastOrigin00SortedList = list;

  const totalStuck = list.reduce(function (s, d) { return s + d.stuck; }, 0);
  const totalWaiting = list.reduce(function (s, d) { return s + d.waiting; }, 0);
  const totalDenom = list.reduce(function (s, d) { return s + (d.createdCohort || d.total); }, 0); // v121: ใช้ฐานเดียวกับการ์ดย่อย (ยอดสร้างทั้งหมด) แทนยอดค้างตอนนี้ ให้สอดคล้องกัน
  const overallPct = totalDenom ? (totalStuck / totalDenom * 100).toFixed(1) : '0.0';

  let html = '<div class="o00-statbar">' +
    '<span class="o00-stat"><b style="color:#B85B50">' + overallPct + '%</b> ตกค้างภาพรวม</span>' +
    '<span class="o00-stat"><b>' + list.filter(function (d) { return d.stuck > 0; }).length + '/' + list.length + '</b> สาขามีบิลตกค้าง</span>' +
    '<span class="o00-stat"><b style="color:#4A80AD">' + totalStuck.toLocaleString('th-TH') + '</b> บิลตกค้างรวม</span>' +
    '<span class="o00-sep"></span>' +
    '<span class="o00-stat lg">' + ICONS.building + 'ตกค้างที่ DC เอง</span>' +
    '<span class="o00-stat lg">' + ICONS.pin + 'ตกค้างที่ Shop/DP</span>' +
    '<span class="o00-stat lg">' + ICONS.clock + 'ตกค้างปกติ (รอรอบถัดไป)</span>' +
    '<span class="o00-stat right">' + (data.mode === 'all' ? 'สะสมทั้งหมด' :
      'บิลที่สร้างวันที่ ' + esc(formatDateLabel(data.cohortDate)) + (data.cohortDate === todayISO() ? ' (วันนี้ — ยังไม่เลย cutoff ของส่วนใหญ่ จึงมักเห็น 0% ไว้ก่อน)' : '')) + '</span>' +
    '</div>';

  function dcDisplayName(name) {
    return String(name || '').replace(/^\s*\S*\d\S*\s+/, '').trim() || name;
  }
  function pctOf(d) {
    const denom = d.createdCohort || d.total;
    return denom ? (d.stuck / denom * 100) : 0;
  }
  function getBand(d) {
    const v = pctOf(d);
    if (d.stuck === 0) return 2;   // ไม่มีตกค้าง
    if (v <= 5) return 1;          // ตกค้าง 0-5%
    return 0;                      // แย่สุด >5%
  }
  // เรียงจากแย่สุดลงมา: แถบบนสุด = ตกค้างมาก
  const bandDefs = [
    { label: 'ตกค้างมากกว่า', sub: '5%', color: '#B8514A', cls: 'lv3' },
    { label: 'ตกค้าง', sub: '0–5%', color: '#E3A63D', cls: 'lv2' },
    { label: 'ไม่มีตกค้าง', sub: '0%', color: '#5A93C4', cls: 'lv0' }
  ];
  const bands = [[], [], []];
  list.forEach(function (d) { bands[getBand(d)].push(d); });
  // ในแต่ละแถบ เรียงหนักสุดอยู่ซ้ายบน (ยกเว้นเลือกเรียงตามชื่อ)
  if (sortBy !== 'name') {
    bands.forEach(function (b) {
      b.sort(function (x, y) { return (pctOf(y) - pctOf(x)) || (y.stuck - x.stuck); });
    });
  }

  html += '<div class="o00-bands" id="origin00Bands">';
  let globalRank = 0; // v96: นับลำดับตามที่การ์ดแสดงจริงบนจอ ต่อเนื่องข้ามทุกกลุ่มสี ไม่อิงตำแหน่งจากลิสต์ที่เรียงคนละเกณฑ์
  bands.forEach(function (bandList, bandIdx) {
    if (bandList.length === 0) return;
    const bd = bandDefs[bandIdx];
    html += '<div class="o00-band-row">' +
      '<div class="o00-band-label"><span class="o00-band-dot" style="background:' + bd.color + '"></span>' +
      '<span>' + bd.label + ' ' + bd.sub + '<span class="o00-band-count">(' + bandList.length + ')</span></span></div>' +
      '<div class="o00-chips">';
    bandList.forEach(function (d, k) {
      const i = list.indexOf(d);
      globalRank++;
      const bigPct = d.createdCohort ? pctOf(d).toFixed(1) + '%' : d.stuck.toLocaleString('th-TH') + ' บิล';
      const createdLine = d.createdCohort ? ((data.mode === 'all' ? 'สร้างสะสมทั้งหมด ' : 'สร้างวันนั้น ') + d.createdCohort.toLocaleString('th-TH') + ' บิล') : '';
      // v87: ในกลุ่ม "ไม่มีตกค้าง 0%" เอง แยกสาขาที่เคลียร์หมดจริง (waiting=0 ด้วย)
      // ออกจากสาขาที่แค่ยังรอรอบรถปกติอยู่ (waiting > 0) ด้วยไอคอน + สีที่ต่างกัน
      const isPerfect = bandIdx === 2 && d.waiting === 0;
      const perfectBadge = isPerfect
        ? '<span class="o00-chip-perfect-badge" title="เยี่ยม — บิลที่สร้างวันนั้นขึ้นรถออกจากสาขาหมดแล้วทุกใบ ไม่มีเหลือรอเลย">' + ICONS.check + '</span>'
        : '';
      // v100: เปลี่ยนจากแถบสัดส่วน (บาร์) เป็นไอคอน+ตัวเลขแทน — บาร์ดูยากเวลาสัดส่วนเทเข้าข้างเดียวเกือบหมด
      // รูปทรงไอคอนบอกหมวด (ตึก=DC เอง, หมุด=Shop/DP, นาฬิกา=รอรอบ) สีเป็น currentColor เลยอ่านง่ายบนพื้นการ์ดทุกสี
      const iconRow = '<div class="o00-chip-iconrow">' +
        (d.stuckAtDC ? '<span class="o00-icnum" data-dc-idx="' + i + '" data-cat="stuckDC" title="ตกค้างที่ DC เอง">' + ICONS.building + '<b>' + d.stuckAtDC + '</b></span>' : '') +
        (d.stuckAtSub ? '<span class="o00-icnum" data-dc-idx="' + i + '" data-cat="stuckSub" title="ตกค้างที่ Shop/DP — กดดูว่าจุดไหน">' + ICONS.pin + '<b>' + d.stuckAtSub + '</b></span>' : '') +
        (d.waiting ? '<span class="o00-icnum" data-dc-idx="' + i + '" data-cat="waiting" title="รอรอบถัดไปตามปกติ">' + ICONS.clock + '<b>' + d.waiting + '</b></span>' : '') +
        '</div>';
      // ถ้ามีบิลค้างที่ Shop/DP ปลายทางย่อยหลายจุด บอกจำนวนจุดไว้ด้วย (ตัวเลขบิลอยู่ในไอคอนหมุดข้างบนแล้ว)
      const subHint = (d.stuckAtSub && d.subBreakdownList && d.subBreakdownList.length > 1)
        ? '<div class="o00-chip-subhint" data-dc-idx="' + i + '">Shop/DP ' + d.subBreakdownList.length + ' จุด — กดดูรายจุด</div>'
        : '';
      html += '<div class="o00-chip ' + bd.cls + (isPerfect ? ' o00-perfect' : '') + '" data-dc-idx="' + i + '">' +
        '<div class="o00-chip-rank">' + globalRank + '</div>' +
        '<div class="o00-chip-name" title="' + esc(d.dc) + '">' + perfectBadge + esc(dcDisplayName(d.dc)) + '</div>' +
        '<div class="o00-chip-nums"><span class="o00-chip-big">' + bigPct + '</span></div>' +
        (createdLine ? '<div class="o00-chip-created">' + createdLine + '</div>' : '') +
        iconRow + subHint +
        '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';

  html += '<div id="origin00Drilldown"></div>';
  html += '<div style="font-size:11px;color:var(--text-faint);margin-top:10px">อัปเดตล่าสุด: ' + new Date(data.generatedAt).toLocaleString('th-TH') +
    (data.skippedNoData ? ' — ' + data.skippedNoData + ' บิลไม่มีข้อมูล cutoff พอตัดสิน ถูกจัดเป็น "ตกค้างปกติ" ไว้ก่อน' : '') + ' — คลิกไอคอน+ตัวเลขเพื่อดูเฉพาะกลุ่มนั้น (ตึก=ติดที่ DC เอง, หมุด=ติดที่ Shop/DP — กดดูได้ว่าจุดไหนบ้าง, นาฬิกา=รอรอบปกติ)</div>';
  container.innerHTML = html;

  function openO00Drilldown(idx, cat) {
    const d = lastOrigin00SortedList[idx];
    if (!d) return;
    const bills = cat === 'stuck' ? d.stuckBills : cat === 'stuckDC' ? d.stuckAtDCBills : d.waitingBills;
    const label = cat === 'stuck' ? 'ตกค้างจากการจัดการ (รวม)' : cat === 'stuckDC' ? 'ตกค้างที่ DC เอง' : 'ตกค้างปกติ (รอรอบถัดไป)';
    let html2 = '<div class="drilldown-head"><span>รายการบิล — ' + esc(dcDisplayName(d.dc)) + ' (' + label + ', ' + bills.length + ' บิล)</span>' +
      '<span class="drilldown-close" id="closeOrigin00Drilldown">' + ICONS.close + ' ปิด</span></div>';
    html2 += '<div class="bill-chip-list">' + bills.map(function (bill) {
      return '<span class="bill-chip' + (cat !== 'waiting' ? ' abnormal' : '') + '" data-bill="' + esc(bill) + '">' + esc(bill) + '</span>';
    }).join('') + '</div>';
    const box = document.getElementById('origin00Drilldown');
    box.innerHTML = html2;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    document.getElementById('closeOrigin00Drilldown').addEventListener('click', function () { box.innerHTML = ''; });
    box.querySelectorAll('.bill-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        openBillModal(chip.getAttribute('data-bill'));
      });
    });
  }

  // v99: ตกค้างที่ Shop/DP กดแล้วอยากรู้ว่า "จุดไหน" เป็นปัญหา ไม่ใช่แค่รายชื่อบิลรวมๆ
  // เลยแยกเป็นมุมมองสรุปตามจุด (point) ก่อน แล้วค่อยกดต่อลงไปดูเลขบิลของจุดนั้นๆ
  function openO00SubBreakdown(idx) {
    const d = lastOrigin00SortedList[idx];
    if (!d || !d.subBreakdownList || d.subBreakdownList.length === 0) return;
    let html2 = '<div class="drilldown-head"><span>ตกค้างที่ Shop/DP — ' + esc(dcDisplayName(d.dc)) + ' (' + d.subBreakdownList.length + ' จุด, ' + d.stuckAtSub + ' บิล)</span>' +
      '<span class="drilldown-close" id="closeOrigin00Drilldown">' + ICONS.close + ' ปิด</span></div>';
    html2 += '<div class="o00-subbreak-list">' + d.subBreakdownList.map(function (sb, si) {
      return '<div class="o00-subbreak-row" data-si="' + si + '">' +
        '<span class="o00-subbreak-name">' + esc(sb.name || dcDisplayName(sb.point)) +
        '<span class="o00-subbreak-code"> (' + esc(sb.point) + ')</span></span>' +
        '<span class="o00-subbreak-count">' + sb.count + ' บิล</span>' +
        '</div><div class="bill-chip-list o00-subbreak-bills" id="o00SubBills' + si + '" style="display:none"></div>';
    }).join('') + '</div>';
    const box = document.getElementById('origin00Drilldown');
    box.innerHTML = html2;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    document.getElementById('closeOrigin00Drilldown').addEventListener('click', function () { box.innerHTML = ''; });
    box.querySelectorAll('.o00-subbreak-row').forEach(function (row) {
      row.addEventListener('click', function () {
        const si = parseInt(row.getAttribute('data-si'), 10);
        const billsBox = document.getElementById('o00SubBills' + si);
        if (billsBox.style.display !== 'none') { billsBox.style.display = 'none'; return; }
        if (!billsBox.dataset.filled) {
          billsBox.innerHTML = d.subBreakdownList[si].bills.map(function (bill) {
            return '<span class="bill-chip abnormal" data-bill="' + esc(bill) + '">' + esc(bill) + '</span>';
          }).join('');
          billsBox.dataset.filled = '1';
          billsBox.querySelectorAll('.bill-chip').forEach(function (chip) {
            chip.addEventListener('click', function (ev) { ev.stopPropagation(); openBillModal(chip.getAttribute('data-bill')); });
          });
        }
        billsBox.style.display = 'flex';
      });
    });
  }

  // คลิกไอคอน+ตัวเลข = ดูเฉพาะกลุ่มนั้น (ปุ่ม Shop/DP เปิดสรุปแยกตามจุด), คลิกที่การ์ด (ที่ไม่ใช่จุดข้างต้น) = ดูบิลตกค้างรวม (ถ้าไม่มีก็ดูบิลที่รอรอบ)
  container.querySelectorAll('.o00-icnum').forEach(function (seg) {
    seg.addEventListener('click', function (ev) {
      ev.stopPropagation();
      const idx = parseInt(seg.getAttribute('data-dc-idx'), 10);
      const cat = seg.getAttribute('data-cat');
      if (cat === 'stuckSub') { openO00SubBreakdown(idx); return; }
      openO00Drilldown(idx, cat);
    });
  });
  container.querySelectorAll('.o00-chip-subhint').forEach(function (seg) {
    seg.addEventListener('click', function (ev) {
      ev.stopPropagation();
      openO00SubBreakdown(parseInt(seg.getAttribute('data-dc-idx'), 10));
    });
  });

function renderStatusMatrix(data) {
  window.lastMatrixData = data;
  const container = document.getElementById('matrixResult');
  if (!data.rows || data.rows.length === 0) {
    container.innerHTML = '<div class="focus-empty">ไม่มีข้อมูลตรงเงื่อนไขที่เลือก</div>';
    return;
  }
  let maxVal = 1;
  data.rows.forEach(function (r) { r.counts.forEach(function (v) { if (v > maxVal) maxVal = v; }); });

  const stuckColor = data.stuckPct >= 50 ? 'var(--anomaly)' : data.stuckPct >= 25 ? 'var(--watch)' : 'var(--normal)';
  let html = '<div class="history-summary">' +
    '<div class="chip">DC ต้นทาง <b>' + esc(dcDisplayName(data.dc)) + '</b></div>' +
    '<div class="chip">' + (data.dateFilter ? 'เฉพาะบิลที่สร้างวันที่ <b>' + esc(formatDateLabel(data.dateFilter)) + '</b>' : 'ช่วงเวลา <b>ทั้งหมด</b>') + '</div>' +
    '<div class="chip">ประเภทบิล <b>' + (data.billTypeFilter === 'CC' ? 'COLDCHAIN' : data.billTypeFilter === 'AB' ? 'NORMAL' : 'ทั้งหมด') + '</b></div>' +
    '<div class="chip">บิลทั้งหมด <b>' + data.totalBills.toLocaleString('th-TH') + '</b></div>' +
    '<div class="chip">' + ICONS.check + ' ส่งสำเร็จแล้ว <b style="color:var(--normal)">' + data.deliveredCount.toLocaleString('th-TH') + '</b></div>' +
    '<div class="chip">' + ICONS.warn + ' ยังตกค้าง (ยังไม่ส่งสำเร็จ) <b style="color:' + stuckColor + '">' + data.stuckCount.toLocaleString('th-TH') + ' (' + data.stuckPct + '%)</b></div>' +
    '</div>';

  html += '<div class="table-scroll" style="max-height:460px"><table class="matrix-table"><thead><tr><th class="row-label">สถานะ</th>';
  data.columns.forEach(function (c) { html += '<th>' + esc(c) + '</th>'; });
  html += '</tr></thead><tbody>';
  data.rows.forEach(function (r, ri) {
    html += '<tr><td class="row-label">' + esc(friendlyStatus(r.status)) + '<div class="sub">' + esc(r.status) + '</div></td>';
    if (r.hasCutoffBreakdown) {
      r.counts.forEach(function (v, i) {
        const overdue = r.overdue[i] || 0;
        const waiting = r.waiting[i] || 0;
        if (v === 0) { html += '<td class="matrix-cell">—</td>'; return; }
        let cellHtml = '<span class="clickable-num" data-row="' + ri + '" data-col="' + i + '" data-subset="waiting">' + waiting + '</span>';
        if (overdue > 0) cellHtml += ' <span class="clickable-num" data-row="' + ri + '" data-col="' + i + '" data-subset="overdue" style="color:var(--anomaly);font-weight:700">+' + overdue + '' + ICONS.warn + '</span>';
        const bg = overdue > 0 ? 'rgba(216,72,61,0.12)' : 'rgba(30,158,107,0.12)';
        html += '<td class="matrix-cell" style="background:' + bg + '">' + cellHtml + '</td>';
      });
    } else {
      r.counts.forEach(function (v, i) {
        const prev = i > 0 ? r.counts[i - 1] : null;
        const stuck = prev !== null && v > 0 && v === prev;
        const intensity = v === 0 ? 0 : Math.min(1, v / maxVal);
        const bg = v === 0 ? 'transparent' : 'rgba(30,158,107,' + (0.08 + intensity * 0.3) + ')';
        if (v === 0) { html += '<td class="matrix-cell">—</td>'; return; }
        html += '<td class="matrix-cell" style="background:' + (stuck ? 'rgba(216,72,61,0.18)' : bg) + (stuck ? ';font-weight:700;color:var(--anomaly)' : '') +
          '"><span class="clickable-num" data-row="' + ri + '" data-col="' + i + '" data-subset="all">' + v + '</span></td>';
      });
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="font-size:11.5px;color:var(--text-faint);margin-top:8px">วิเคราะห์เมื่อ: ' + new Date(data.generatedAt).toLocaleString('th-TH') +
    ' — แถว "00 สร้างบิล": ตัวเลขเขียว = ยังรอรอบรถตามปกติ (สร้างหลัง cutoff), <span style="color:var(--anomaly)">+N' + ICONS.warn + '</span> = เลยรอบที่ควรขึ้นรถไปแล้วจริงตาม cutoff ของ Master — แถวอื่นๆ สีแดงเข้ม = ตัวเลขเท่าเดิมจากคอลัมน์ก่อนหน้า (สัญญาณว่าอาจค้าง) — % ตกค้างด้านบนคำนวณจากสถานะล่าสุดของแต่ละบิลในกลุ่มนี้ ณ ตอนนี้</div>';
  html += '<div id="matrixDrilldown"></div>';
  container.innerHTML = html;

  container.querySelectorAll('.clickable-num').forEach(function (el) {
    el.addEventListener('click', function () {
      const ri = parseInt(el.getAttribute('data-row'), 10);
      const ci = parseInt(el.getAttribute('data-col'), 10);
      const subset = el.getAttribute('data-subset');
      const row = window.lastMatrixData.rows[ri];
      let bills, label;
      if (subset === 'waiting') { bills = row.waitingBills[ci]; label = 'ยังรอรอบรถตามปกติ'; }
      else if (subset === 'overdue') { bills = row.overdueBills[ci]; label = (ICONS.warn + ' เลยรอบรถแล้ว'); }
      else { bills = row.bills[ci]; label = 'ทั้งหมด'; }
      showMatrixDrilldown(row.status, window.lastMatrixData.columns[ci], label, bills || []);
    });
  });
}

function renderHistoryTimeline(data, containerId) {
  const container = document.getElementById(containerId || 'historyResult');
  if (!data.found || data.events.length === 0) {
    container.innerHTML = '<div class="focus-empty">ไม่พบประวัติของบิลนี้ใน RawLog (อาจพิมพ์เลขที่บิลผิด หรือยังไม่เคย import เข้าระบบ)</div>';
    return;
  }
  const events = data.events;
  const abnormalCount = events.filter(function (e) { return e.abnormal; }).length;
  const eff = data.effectiveCutoffInfo || null; // v82: จุด + cutoff ที่ backend ใช้ตัดสินจริงสำหรับสถานะ 00
  const lastEv = events[events.length - 1];
  const createdDateShown = data.creationGap ? data.creationGap.trueCreatedDate : (events[0] && events[0].createdDate);

  // ---- v92: verdict ก่อนเลย — สรุปเป็นประโยคเดียวว่า "เป็นยังไง" ก่อนค่อยลงรายละเอียด ----
  const heroClass = lastEv.abnormal ? 'red' : 'normal';
  const heroTitle = (lastEv.abnormal ? ICONS.warn : ICONS.check) + ' ' +
    (lastEv.abnormal ? (eff ? 'ค้างเกินรอบรถที่ควรขึ้น' : 'ค้างสถานะนี้นานผิดปกติ') : esc(friendlyStatus(lastEv.status)));
  const heroSub = 'อยู่สถานะ "' + esc(friendlyStatus(lastEv.status)) + '" มาแล้ว <b>' + lastEv.ongoingHours + ' ชม.</b>' +
    (lastEv.abnormal
      ? (eff ? ' — เลยรอบรถที่ควรขึ้น (<b>' + esc(eff.expectedTruckDate) + '</b>) ไปแล้วจริง' : ' (เกณฑ์ปกติไม่เกิน 24 ชม.)')
      : (eff ? ' — ยังไม่เลยรอบที่ควรขึ้นรถ (<b>' + esc(eff.expectedTruckDate) + '</b>) ถือว่ารอรอบขนย้ายตามปกติ' : ' — ยังไม่ผิดปกติ'));

  let html = '<div class="bh-wrap">';

  // แถวข้อมูลพื้นฐาน — บรรทัดเดียว กวาดตาได้เร็ว แทนที่จะเป็นกล่อง chip เกลื่อนหน้า

    '<span>บิล <b>' + esc(data.bill) + '</b></span>' +
    '<span class="sep">•</span><span>' + esc(data.billType || '—') + '</span>' +
    '<span class="sep">•</span><span>' + esc(dcDisplayName(data.from) || '—') + ' → ' + esc(dcDisplayName(data.to) || '—') + '</span>' +
    (createdDateShown ? '<span class="sep">•</span><span>สร้างจริง <b>' + esc(createdDateShown) + (data.createdTime ? ' ' + esc(data.createdTime) : '') + '</b></span>' : '') +
    '<span class="sep">•</span><span>' + events.length + ' จุดเปลี่ยนสถานะ</span>' +
    '</div>';

  // การ์ดสรุปผล — สีบอกสถานะทันที ไม่ต้องอ่านข้อความ
  html += '<div class="bh-hero ' + heroClass + '"><div class="bh-hero-top">' + heroTitle + '</div><div class="bh-hero-sub">' + heroSub + '</div></div>';

  // แถบเทียบเวลา 4 จุด — สร้างบิล → cutoff → ควรขึ้นรถ → ตอนนี้ (เห็นภาพเดียวรู้เลยว่าห่างกันแค่ไหน)

    html += '<div class="bh-compare">' +
      '<div class="bh-compare-node"><div class="bh-compare-label">สร้างบิล</div><div class="bh-compare-value">' + esc(createdDateShown || '—') + (data.createdTime ? ' ' + esc(data.createdTime) : '') + '</div></div>' +
      '<div class="bh-compare-node"><div class="bh-compare-label">cutoff</div><div class="bh-compare-value">' + (eff.label ? esc(eff.label) + ' น.' : '—') + '</div></div>' +

      '<div class="bh-compare-node now ' + nowClass + '"><div class="bh-compare-label">ตอนนี้</div><div class="bh-compare-value">' + (lastEv.abnormal ? 'เลยแล้ว ' + lastEv.ongoingHours + ' ชม.' : 'ค้าง ' + lastEv.ongoingHours + ' ชม.') + '</div></div>' +
      '</div>' +
      '<div class="bh-compare-caption">ตัดสินด้วย cutoff ของ' + esc(eff.basis || 'จุดที่บิลอยู่') + ' <b class="mono">' +
        esc(eff.pointName ? (eff.pointName + ' (' + eff.point + ')') : (dcDisplayName(eff.point) || eff.point)) + '</b></div>';
  }

  // รายละเอียด/ข้อควรระวัง — พับเก็บไว้ ไม่ให้แย่งความสนใจจากสรุปผลด้านบน แต่ยังกดดูได้
  const detailRows = [];

    detailRows.push(ICONS.warn + ' สร้างบิลจริงวันที่ <b>' + esc(data.creationGap.trueCreatedDate) + '</b> แต่ระบบตรวจพบครั้งแรกวันที่ ' + esc(data.creationGap.firstObservedDate) + ' ' + esc(data.creationGap.firstObservedTime) + ' (รอบดึงข้อมูลก่อนหน้านั้นอาจไม่ครอบคลุมบิลนี้) — ระยะเวลาค้างจุดแรกคำนวณจากวันที่สร้างจริงแล้ว');
  }
  if (eff && eff.movedSinceLastStatusChange) {
    detailRows.push(ICONS.repeat + ' บิลย้ายจุดแล้ว (สร้างที่ <b>' + esc(data.creationPointName ? (data.creationPointName + ' (' + data.creationPoint + ')') : (data.creationPoint || '—')) + '</b>) แต่สถานะยังไม่เปลี่ยน');
  }
  if (data.cutoffInfo) {
    detailRows.push('cutoff ของ DC ต้นทาง (' + esc(data.cutoffInfo.forType) + ') <b>' + esc(data.cutoffInfo.label) + ' น.</b>' +
      (eff && eff.point && extractDcCodeFE(eff.point) !== extractDcCodeFE(data.from) ? ' <span style="color:var(--text-faint)">(อ้างอิงเท่านั้น ไม่ได้ใช้ตัดสิน)</span>' : ''));
  }
  detailRows.push(abnormalCount
    ? ICONS.warn + ' ค้างผิดปกติ <b>' + abnormalCount + '</b> จุด จากทั้งหมด ' + events.length + ' จุด'
    : ICONS.check + ' ยังไม่พบจุดที่ค้างผิดปกติ จากทั้งหมด ' + events.length + ' จุด');
  html += '<details class="bh-details"><summary>รายละเอียดการตัดสิน / ข้อควรระวังของข้อมูล</summary><div class="bh-details-body">' +
    detailRows.map(function (r) { return '<div class="row">' + r + '</div>'; }).join('') +
    '</div></details>';

  // Timeline ลำดับเหตุการณ์ — จุดล่าสุดถูกเน้นด้วย badge กันงงว่าอันไหนคือ "ตอนนี้"
  html += '<div class="bh-timeline-head">ลำดับเหตุการณ์</div><div class="timeline">';
  events.forEach(function (ev, i) {
    const isLast = i === events.length - 1;
    html += '<div class="tl-step' + (isLast ? ' current' + (ev.abnormal ? ' abnormal' : '') : '') + '">' +
      '<div class="tl-rail"><div class="tl-dot' + (ev.abnormal ? ' abnormal' : '') + '"></div>' + (isLast ? '' : '<div class="tl-line"></div>') + '</div>' +
      '<div class="tl-body">' +
      '<div class="tl-status">' + esc(friendlyStatus(ev.status)) + '</div>' +
      '<div class="tl-meta">' + esc(ev.status) + ' — ' + esc(ev.pulledDate) + ' ' + esc(ev.pulledTime) + ' — DC ปัจจุบัน: ' +
        esc(ev.currentPointInfo ? (ev.currentPointInfo.name ? (ev.currentPointInfo.name + ' (' + ev.current + ')') : ev.current) : dcDisplayName(ev.current)) +

        '</div>' +
      (ev.durationHours !== null ?
        '<div class="tl-duration' + (ev.abnormal ? ' abnormal' : '') + '">' + (ev.abnormal ? (ICONS.warn + ' ') : (ICONS.clock + ' ')) + 'อยู่สถานะนี้นาน ' + ev.durationHours + ' ชม. ก่อนเปลี่ยน' + (ev.abnormal ? ' (เกิน 1 วัน — น่าจะพลาดรอบรถ)' : '') + '</div>' :
        (data.lastConfirmed ?
          '<div class="tl-duration" style="color:var(--text-faint)">' + ICONS.repeat + ' ยืนยันล่าสุดว่ายังอยู่สถานะนี้เมื่อ ' + esc(data.lastConfirmed) + ' (ดึงเจอซ้ำแต่สถานะไม่เปลี่ยน)</div>' : '')) +
      '</div></div>';
  });
  html += '</div></div>';
  container.innerHTML = html;
}

function friendlyStatus(raw) {
  const s = String(raw || '');
  const code = s.trim().split(/\s+/)[0];
  const map = [
    [/^00/, 'สร้างบิลแล้ว รอขึ้นรถ'],
    [/^01/, 'ขึ้นรถที่ต้นทางแล้ว'],
    [/^0210[0-9]01/, 'ขึ้นรถระหว่างทาง'],
    [/^0210[0-9]02/, 'ออกจาก DC ระหว่างทาง'],
    [/^0210/, 'ถึง DC ระหว่างทาง (รอขนย้ายต่อ)'],
    [/^02/, 'ออกจาก DC ต้นทางแล้ว'],
    [/^030/, 'ถึงปลายทาง (รอชั่งน้ำหนัก)'],
    [/^031/, 'ถึงปลายทาง (รอกระจายสินค้า)'],
    [/^033/, 'ถึงปลายทาง (ลูกค้ามารับเอง)'],
    [/^034/, 'ถึงปลายทาง (ส่งภายใน)'],
    [/^04/, 'ขึ้นรถเพื่อกระจายสินค้า'],
    [/^05101/, 'จัดส่งไม่สำเร็จ ครั้งที่ 1'],
    [/^05102/, 'จัดส่งไม่สำเร็จ ครั้งที่ 2'],
    [/^05103/, 'จัดส่งไม่สำเร็จ ครั้งที่ 3'],
    [/^05199/, 'จัดส่งไม่ได้ กำลังส่งกลับ'],
    [/^052/, 'จัดส่งสำเร็จ'],
    [/^053/, 'ส่งต่อให้สาขาอื่น'],
    [/^054/, 'ลูกค้ามารับที่จุดรับสินค้า'],
    [/^05/, 'กำลังจัดส่งสินค้า'],
    [/^06/, 'ถึงมือผู้รับแล้ว']
  ];
  for (const [re, label] of map) { if (re.test(code)) return label; }
  return s;
}
