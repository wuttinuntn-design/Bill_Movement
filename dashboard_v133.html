      this.classList.add('active');
      cohortBillType = this.getAttribute('data-billtype');
      lastCohortWeekly = null; lastCohortDaily = null; // ข้อมูลต่างประเภทบิล ต้องดึงใหม่เสมอ
      doCohortRollup();
    });
  });
  // v131: สลับมุมมอง ภาพรวม / ปัญหาที่ DC / ปัญหาเข้ารับ Shop/DP / อันดับรายจุด — ใช้ข้อมูลชุดเดิม ไม่ต้องโหลดใหม่
  ['cohortFocusAll', 'cohortFocusDC', 'cohortFocusSub', 'cohortFocusPoints'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function () {
      document.querySelectorAll('#cohortFocusAll,#cohortFocusDC,#cohortFocusSub,#cohortFocusPoints').forEach(function (b) { b.classList.remove('active'); });
      this.classList.add('active');
      cohortFocusMode = this.getAttribute('data-focus');
      renderCohortPeriodGrid();
    });
  });
  document.getElementById('cohortPrevBtn').addEventListener('click', function () { shiftCohortPeriod(-1); });
  document.getElementById('cohortNextBtn').addEventListener('click', function () { shiftCohortPeriod(1); });
  doCohortRollup();
}

async function doCohortRollup() {
  const container = document.getElementById('cohortRollupResult');
  container.innerHTML = '<div class="focus-empty">กำลังโหลด...</div>';
  try {
    if (cohortViewMode === 'weekly') {
      if (!lastCohortWeekly) {
        const json = await jsonp(WEBAPP_URL + '?action=getCohortWeeklyRollup&billType=' + encodeURIComponent(cohortBillType));
        if (!json.ok) throw new Error(json.error || 'unknown error');
        lastCohortWeekly = json.data;
      }
    } else {
      if (!lastCohortDaily) {
        const json = await jsonp(WEBAPP_URL + '?action=getCohortDailyStats&weeks=8&billType=' + encodeURIComponent(cohortBillType));
        if (!json.ok) throw new Error(json.error || 'unknown error');
        lastCohortDaily = json.data;
      }
    }
    renderCohortPeriodGrid();
  } catch (err) {
    container.innerHTML = '<div class="focus-empty">โหลดไม่สำเร็จ: ' + esc(err.message) + '</div>';
  }
}

function shiftCohortPeriod(delta) {
  const rows = cohortViewMode === 'weekly' ? lastCohortWeekly : lastCohortDaily;
  const keyField = cohortViewMode === 'weekly' ? 'weekStart' : 'date';
  if (!rows || rows.length === 0) return;
  const periods = Array.from(new Set(rows.map(function (r) { return r[keyField]; }))).sort();
  let idx = (cohortViewMode === 'weekly' ? cohortWeekIdx : cohortDayIdx);
  if (idx === null) idx = 0; // เริ่มจากช่วงเก่าสุดเป็นค่าเริ่มต้น (เรียงเก่า->ใหม่)
  idx = Math.max(0, Math.min(periods.length - 1, idx + delta));
  if (cohortViewMode === 'weekly') cohortWeekIdx = idx; else cohortDayIdx = idx;
  renderCohortPeriodGrid();
}

function renderCohortPeriodGrid() {
  const container = document.getElementById('cohortRollupResult');
  const rows = cohortViewMode === 'weekly' ? lastCohortWeekly : lastCohortDaily;
  const keyField = cohortViewMode === 'weekly' ? 'weekStart' : 'date';
  const label = document.getElementById('cohortPeriodLabel');
  const prevBtn = document.getElementById('cohortPrevBtn');
  const nextBtn = document.getElementById('cohortNextBtn');

  if (!rows || rows.length === 0) {
    label.textContent = '';
    prevBtn.disabled = true; nextBtn.disabled = true;
    container.innerHTML = cohortViewMode === 'weekly'
      ? '<div class="focus-empty">ยังไม่มีสัปดาห์ไหนสรุปผลครบ (ต้องรอให้ครบ 7 วัน + เผื่อ 3 วันให้บิล resolve ก่อน — เช็คว่าตั้ง trigger dailyCohortRollupJob แล้วหรือยัง)</div>'
      : '<div class="focus-empty">ยังไม่มีวันไหนสรุปผลครบ (ต้องรออายุ 3 วันหลังวันสร้างบิลก่อน)</div>';
    return;
  }

  const periods = Array.from(new Set(rows.map(function (r) { return r[keyField]; }))).sort(); // เก่า -> ใหม่
  let idx = (cohortViewMode === 'weekly' ? cohortWeekIdx : cohortDayIdx);
  if (idx === null || idx >= periods.length) idx = 0; // ค่าเริ่มต้น = ช่วงเก่าสุด
  if (cohortViewMode === 'weekly') cohortWeekIdx = idx; else cohortDayIdx = idx;

  const currentKey = periods[idx];
  const prevKey = idx > 0 ? periods[idx - 1] : null;
  const prevRows = prevKey ? rows.filter(function (r) { return r[keyField] === prevKey; }) : [];
  const prevByDc = {};
  prevRows.forEach(function (r) { prevByDc[r.dc] = r; });
  const allCurRows = rows.filter(function (r) { return r[keyField] === currentKey; });

  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === periods.length - 1);
  const first = allCurRows[0];
  const partialNote = (cohortViewMode === 'weekly' && first && first.daysCount && first.daysCount < 7) ? ' (มีข้อมูล ' + first.daysCount + ' วัน)' : '';
  label.textContent = cohortViewMode === 'weekly'
    ? (first ? fmtDdMm(first.weekStart) + ' - ' + fmtDdMm(first.weekEnd) + partialNote : fmtDdMm(currentKey))
    : fmtDdMm(currentKey);
  const rangeFrom = currentKey;
  const rangeTo = cohortViewMode === 'weekly' ? (first ? first.weekEnd : currentKey) : currentKey;
  const periodWord = cohortViewMode === 'weekly' ? 'สัปดาห์' : 'วัน';
  const hasSplitData = allCurRows.some(function (r) { return r.subCreated !== undefined || r.dcCreated !== undefined; });

  document.getElementById('cohortDrilldown').innerHTML = ''; // ปิด drilldown เก่าทุกครั้งที่เปลี่ยนช่วงเวลา/โหมด

  if ((cohortFocusMode === 'dc' || cohortFocusMode === 'sub' || cohortFocusMode === 'points') && !hasSplitData) {
    container.innerHTML = '<div class="focus-empty">ข้อมูลช่วงนี้ยังไม่มีการแยก DC / Shop/DP — ต้อง rebuild Cohort ด้วย GAS v140 ก่อน (ลบชีท Cohort ทั้ง 3 → runEnsureCohortSheets → cohortStep3_Rebuild)</div>';
    return;
  }

  if (cohortFocusMode === 'points') { renderCohortPointRanking_(container, allCurRows, prevRows, rangeFrom, rangeTo, periodWord); return; }

  // v131: นิยามตัวเลขตามโหมด — ภาพรวม = ผิดปกติ/ทั้งหมด, DC = ค้างที่ DC/บิลที่สร้างที่ DC, Shop/DP = ค้างที่ Shop/DP/บิลที่สร้างที่ Shop/DP
  const M = {
    all: { num: function (r) { return r.abnormal || 0; }, den: function (r) { return r.total || 0; }, big: 'ตกค้าง', denLabel: 'รวม' },
    // v132: ตัวหารโหมด DC / Shop/DP = บิลรวมทั้งสาขา (เหมือนภาพรวม) — แม่นกว่าเพราะบิลที่ขยับก่อนรอบดึงแรก
    // ระบุจุดสร้างไม่ได้แน่นอน แต่ตัวตั้ง (บิลผิดปกติ) เห็นสถานะ 00 เสมอ จึงรู้จุดสร้างแน่นอน -> % DC + % Shop/DP = % ภาพรวม
    dc: { num: function (r) { return r.abnormalAtDC || 0; }, den: function (r) { return r.total || 0; }, big: 'ค้างที่ DC', denLabel: 'บิลรวม' },
    sub: { num: function (r) { return r.abnormalAtSub || 0; }, den: function (r) { return r.total || 0; }, big: 'รถไม่เข้ารับ', denLabel: 'บิลรวม' }
  }[cohortFocusMode] || null;
  function pctOf(r) { const d = M.den(r); return d ? Math.round(M.num(r) / d * 1000) / 10 : 0; }

  // โหมด DC/Shop-DP: สาขาที่ไม่มีบิลสร้างที่จุดประเภทนั้นเลย ไม่เอามาจัดอันดับ (หารด้วย 0 ไม่มีความหมาย)
  const curRows = allCurRows.filter(function (r) { return cohortFocusMode === 'all' || M.den(r) > 0; })
    .sort(function (a, b) { return (pctOf(b) - pctOf(a)) || (M.num(b) - M.num(a)); });
  const excluded = allCurRows.length - curRows.length;

  const denAll = curRows.reduce(function (s, r) { return s + M.den(r); }, 0);
  const numAll = curRows.reduce(function (s, r) { return s + M.num(r); }, 0);
  const overallPct = denAll ? Math.round(numAll / denAll * 1000) / 10 : 0;
  const modeTitle = cohortFocusMode === 'dc' ? 'ตกค้างที่ DC เอง (ไม่นำขึ้นขนย้าย)' : cohortFocusMode === 'sub' ? 'รถไม่เข้ารับที่ Shop/DP' : 'ตกค้าง';

  let html = '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">ภาพรวมทุกสาขา: <b style="color:' + cohortAbnormalColor(overallPct) + '">' + overallPct + '%</b> ' + modeTitle +
    ' (' + numAll.toLocaleString('th-TH') + ' จาก ' + denAll.toLocaleString('th-TH') + ' บิลรวม, ' + curRows.length + ' สาขา)';
  if (cohortFocusMode === 'all' && hasSplitData) {
    const atDCAll = curRows.reduce(function (s, r) { return s + (r.abnormalAtDC || 0); }, 0);
    const atSubAll = curRows.reduce(function (s, r) { return s + (r.abnormalAtSub || 0); }, 0);
    html += ' — <span style="white-space:nowrap">' + ICONS.building + ' ที่ DC เอง <b>' + atDCAll.toLocaleString('th-TH') + '</b></span> · <span style="white-space:nowrap">' + ICONS.pin + ' ที่ Shop/DP <b>' + atSubAll.toLocaleString('th-TH') + '</b></span>';
  }
  if (excluded > 0) html += '<br><span style="font-size:11px;color:var(--text-faint)">ไม่นำมาจัดอันดับ ' + excluded + ' สาขา (ไม่มีบิลที่' + M.denLabel + ' ใน' + periodWord + 'นี้)</span>';
  html += '</div>';

  const bandDefs = [
    { label: cohortFocusMode === 'all' ? 'ตกค้างมากกว่า' : 'มีปัญหามากกว่า', sub: '5%', color: '#B8514A' },
    { label: cohortFocusMode === 'all' ? 'ตกค้าง' : 'มีปัญหา', sub: '0–5%', color: '#E3A63D' },
    { label: cohortFocusMode === 'all' ? 'ไม่มีตกค้าง' : 'ไม่มีปัญหา', sub: '0%', color: '#5A93C4' }
  ];
  const bands = [[], [], []];
  curRows.forEach(function (r) { bands[M.num(r) === 0 ? 2 : (pctOf(r) <= 5 ? 1 : 0)].push(r); });

  html += '<div class="o00-bands">';
  bands.forEach(function (bandList, bandIdx) {
    if (bandList.length === 0) return;
    const bd = bandDefs[bandIdx];
    html += '<div class="o00-band-row">' +
      '<div class="o00-band-label"><span class="o00-band-dot" style="background:' + bd.color + '"></span>' +
      '<span>' + bd.label + ' ' + bd.sub + '<span class="o00-band-count">(' + bandList.length + ')</span></span></div>' +
      '<div class="o00-chips">';
    bandList.forEach(function (r) {
      const pct = pctOf(r);
      const tone = cohortCardTone(pct);
      const prev = prevByDc[r.dc];
      let deltaLine = '';
      if (prev && (cohortFocusMode === 'all' || M.den(prev) > 0)) {
        const diff = Math.round((pct - pctOf(prev)) * 10) / 10;
        const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '—');
        const color = diff > 0 ? 'var(--anomaly)' : (diff < 0 ? 'var(--normal)' : 'var(--text-faint)'); // ปัญหาเพิ่ม = แย่ลง (แดง), ลด = ดีขึ้น (เขียว)
        deltaLine = '<div class="o00-chip-created" style="color:' + color + '">' + arrow + ' ' + Math.abs(diff) + ' จุด จาก' + periodWord + 'ก่อน</div>';
      }
      const dcAttr = ' data-cdc="' + esc(r.dc) + '" data-cfrom="' + rangeFrom + '" data-cto="' + rangeTo + '"';
      const showDC = cohortFocusMode !== 'sub' && r.abnormalAtDC;
      const showSub = cohortFocusMode !== 'dc' && r.abnormalAtSub;
      const iconRow = (showDC || showSub) ? '<div class="o00-chip-iconrow">' +
        (showDC ? '<span class="o00-icnum cohort-icnum"' + dcAttr + ' data-cat="dc" title="ตกค้างที่ DC เอง (ไม่นำขึ้นขนย้าย)">' + ICONS.building + '<b>' + r.abnormalAtDC.toLocaleString('th-TH') + '</b></span>' : '') +
        (showSub ? '<span class="o00-icnum cohort-icnum"' + dcAttr + ' data-cat="sub" title="ตกค้างที่ Shop/DP (รถไม่เข้ารับ) — กดดูว่าจุดไหน">' + ICONS.pin + '<b>' + r.abnormalAtSub.toLocaleString('th-TH') + '</b></span>' : '') +
        '</div>' : '';
      const badPoints = (r.subBreakdownList || []).filter(function (sb) { return sb.count > 0; });
      let subHint = '';
      if (showSub && badPoints.length) {
        subHint = cohortFocusMode === 'sub'
          ? '<div class="o00-chip-subhint cohort-icnum"' + dcAttr + ' data-cat="sub">แย่สุด: ' + esc(badPoints[0].name || badPoints[0].point) + ' (' + badPoints[0].count + ')' + (badPoints.length > 1 ? ' +' + (badPoints.length - 1) + ' จุด' : '') + '</div>'
          : (badPoints.length > 1 ? '<div class="o00-chip-subhint cohort-icnum"' + dcAttr + ' data-cat="sub">Shop/DP ' + badPoints.length + ' จุด — กดดูรายจุด</div>' : '');
      }
      const infoLine = cohortFocusMode === 'all'
        ? 'รวม ' + r.total.toLocaleString('th-TH') + ' (ปกติ ' + r.normal.toLocaleString('th-TH') + ' / ช้า ' + (r.abnormal - (r.neverLeft || 0)).toLocaleString('th-TH') + ' / ไม่ขยับเลย ' + (r.neverLeft || 0).toLocaleString('th-TH') + ')'
        : M.denLabel + ' ' + M.den(r).toLocaleString('th-TH') + ' บิล · ค้าง ' + M.num(r).toLocaleString('th-TH') +
          (cohortFocusMode === 'sub' ? ' · ' + (r.subBreakdownList || []).length + ' จุดในสังกัด' : '');
      html += '<div class="o00-chip" style="background:' + tone.bg + ';border-color:' + tone.border + ';color:' + tone.text + ';cursor:pointer" ' +
        'data-cohort-dc="' + esc(r.dc) + '" data-cohort-from="' + rangeFrom + '" data-cohort-to="' + rangeTo + '" title="กดเพื่อดูรายชื่อบิล">' +
        '<div class="o00-chip-name" style="color:' + tone.text + '">' + esc(dcDisplayName(r.dc)) + '</div>' +
        '<div class="o00-chip-nums"><span class="o00-chip-big" style="color:' + tone.text + '">' + pct + '% ' + M.big + '</span></div>' +
        '<div class="o00-chip-created">' + infoLine + '</div>' +
        deltaLine + iconRow + subHint +
        '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  html += '<div style="font-size:11px;color:var(--text-faint);margin-top:10px">' +
    (cohortFocusMode === 'sub' ? '% = บิลที่ค้างเพราะรถไม่เข้ารับที่ Shop/DP ÷ บิลรวมทั้งสาขา (% DC + % Shop/DP = % ภาพรวม) — ' :
     cohortFocusMode === 'dc' ? '% = บิลที่ค้างที่ DC เอง ÷ บิลรวมทั้งสาขา (% DC + % Shop/DP = % ภาพรวม) — ' : '') +
    'คลิกไอคอน+ตัวเลขเพื่อดูเฉพาะกลุ่มนั้น (ตึก=ตกค้างที่ DC เอง, หมุด=ตกค้างที่ Shop/DP รถไม่เข้ารับ — กดดูได้ว่าจุดไหนบ้าง) — คลิกการ์ดเพื่อดูบิล</div>';
  container.innerHTML = html;

  const cardFocus = cohortFocusMode === 'dc' ? 'dc' : cohortFocusMode === 'sub' ? 'sub' : '';
  container.querySelectorAll('[data-cohort-dc]').forEach(function (chip) {
    chip.addEventListener('click', function () {
      openCohortDrilldown(chip.getAttribute('data-cohort-dc'), chip.getAttribute('data-cohort-from'), chip.getAttribute('data-cohort-to'), cardFocus);
    });
  });
  container.querySelectorAll('.cohort-icnum').forEach(function (seg) {
    seg.addEventListener('click', function (ev) {
      ev.stopPropagation();
      openCohortDrilldown(seg.getAttribute('data-cdc'), seg.getAttribute('data-cfrom'), seg.getAttribute('data-cto'), seg.getAttribute('data-cat'));
    });
  });
}

/**
 * v131: จัดอันดับรายจุด Shop/DP รวมทุกสาขา — จุดไหนรถไม่เข้ารับบ่อยสุด (เรียงตามจำนวนบิลค้าง)
 * อัตรา = บิลค้างที่จุดนั้น ÷ บิลที่สร้างที่จุดนั้นทั้งหมด, เทียบจำนวนกับช่วงก่อนหน้า
 */
function renderCohortPointRanking_(container, curRows, prevRows, rangeFrom, rangeTo, periodWord) {
  function collect(list) {
    const map = {};
    list.forEach(function (r) {
      (r.subBreakdownList || []).forEach(function (sb) {
        const key = r.dc + '|' + sb.point;
        if (!map[key]) map[key] = { dc: r.dc, point: sb.point, name: sb.name || '', count: 0, created: 0 };
        map[key].count += sb.count || 0;
        map[key].created += sb.created || 0;
      });
    });
    return map;
  }
  const cur = collect(curRows), prev = collect(prevRows);
  const dcTotal = {}; // v132: บิลรวมของแต่ละสาขา ใช้เป็นตัวหาร "% ของบิลสาขา"
  curRows.forEach(function (r) { dcTotal[r.dc] = (dcTotal[r.dc] || 0) + (r.total || 0); });
  const all = Object.values(cur);
  const bad = all.filter(function (p) { return p.count > 0; })
    .sort(function (a, b) { return (b.count - a.count) || ((dcTotal[b.dc] ? b.count / dcTotal[b.dc] : 0) - (dcTotal[a.dc] ? a.count / dcTotal[a.dc] : 0)); });
  const totalAllBills = curRows.reduce(function (s, r) { return s + (r.total || 0); }, 0);
  const totalBad = bad.reduce(function (s, p) { return s + p.count; }, 0);
  const dcsWithBad = new Set(bad.map(function (p) { return p.dc; })).size;

  let html = '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">' + ICONS.pin + ' จุด Shop/DP ที่รถไม่เข้ารับ: <b style="color:var(--anomaly)">' + bad.length + '</b> จุด จากทั้งหมด ' + all.length + ' จุด (' + dcsWithBad + ' สาขา) — ค้างรวม <b>' + totalBad.toLocaleString('th-TH') + '</b> จาก ' + totalAllBills.toLocaleString('th-TH') + ' บิลรวม</div>';
  if (!bad.length) {
    container.innerHTML = html + '<div class="focus-empty">' + periodWord + 'นี้ไม่มีจุด Shop/DP ไหนที่รถไม่เข้ารับเลย ' + ICONS.check + '</div>';
    return;
  }
  html += '<div class="table-scroll" style="max-height:460px"><table><thead><tr>' +
    '<th class="num">#</th><th>จุด Shop/DP</th><th>DC ต้นทาง</th><th class="num">ค้าง</th><th class="num">% ของบิลสาขา</th><th class="num">เทียบ' + periodWord + 'ก่อน</th>' +
    '</tr></thead><tbody>';
  bad.forEach(function (p, i) {
    const rate = dcTotal[p.dc] ? Math.round(p.count / dcTotal[p.dc] * 1000) / 10 : null;
    const pv = prev[p.dc + '|' + p.point];
    let delta = '<span style="color:var(--text-faint)">ใหม่</span>';
    if (prevRows.length === 0) delta = '<span style="color:var(--text-faint)">—</span>';
    else if (pv) {
      const d = p.count - pv.count;
      delta = d > 0 ? '<span style="color:var(--anomaly)">▲ ' + d + '</span>' : d < 0 ? '<span style="color:var(--normal)">▼ ' + Math.abs(d) + '</span>' : '<span style="color:var(--text-faint)">—</span>';
    }
    html += '<tr class="cohort-point-row" style="cursor:pointer" data-cdc="' + esc(p.dc) + '" data-point="' + esc(p.point) + '" title="กดดูรายชื่อบิล">' +
      '<td class="num">' + (i + 1) + '</td>' +
      '<td><b>' + esc(p.name || p.point) + '</b> <span class="o00-subbreak-code">(' + esc(p.point) + ')</span></td>' +
      '<td>' + esc(dcDisplayName(p.dc)) + '</td>' +
      '<td class="num" style="color:var(--anomaly);font-weight:700">' + p.count + '</td>' +
      '<td class="num" style="font-weight:700;color:' + (rate === null ? 'var(--text-faint)' : cohortAbnormalColor(rate)) + '">' + (rate === null ? '—' : rate + '%') + '</td>' +
      '<td class="num">' + delta + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="font-size:11px;color:var(--text-faint);margin-top:8px">เรียงตามจำนวนบิลค้างมากสุด — % = บิลค้างที่จุดนี้ ÷ บิลรวมทั้งสาขาใน' + periodWord + 'นี้ (จุดนี้ฉุดผลสาขาไปกี่ %) — กดแถวเพื่อดูรายชื่อบิลของจุดนั้น</div>';
  container.innerHTML = html;
  container.querySelectorAll('.cohort-point-row').forEach(function (tr) {
    tr.addEventListener('click', function () {
      openCohortDrilldown(tr.getAttribute('data-cdc'), rangeFrom, rangeTo, 'sub', tr.getAttribute('data-point'));
    });
  });
}

async function openCohortDrilldown(dc, dateFrom, dateTo, focus, focusPoint) {
  const box = document.getElementById('cohortDrilldown');
  box.innerHTML = '<div class="focus-empty">กำลังโหลดรายชื่อบิล...</div>';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  try {

    if (focus === 'dc' || focus === 'sub') {

      box.innerHTML = html2;
      wireCohortDrilldown_(box, subList);
      if (focusPoint) { // v131: มาจากตารางอันดับรายจุด -> กางรายชื่อบิลของจุดนั้นให้เลย

    html2 += '<div class="bill-chip-list">' + (data.stuck.length ? data.stuck.map(function (bill) {

    html2 += '<div class="bill-chip-list">' + (data.normal.length ? data.normal.map(function (bill) {

/** v130: ผูก event ของ drilldown Cohort — ปุ่มปิด, กดเลขบิลเปิด modal, กดแถวจุด Shop/DP เพื่อกาง/หุบรายชื่อบิล */
function wireCohortDrilldown_(box, subList) {
  document.getElementById('closeCohortDrilldown').addEventListener('click', function () { box.innerHTML = ''; });
  box.querySelectorAll('.bill-chip').forEach(function (chip) {
    chip.addEventListener('click', function () { openBillModal(chip.getAttribute('data-bill')); });
  });
  box.querySelectorAll('.cohort-sub-row').forEach(function (row) {
    row.addEventListener('click', function () {
      const si = parseInt(row.getAttribute('data-si'), 10);
      const billsBox = document.getElementById('cohortSubBills' + si);
      if (billsBox.style.display !== 'none') { billsBox.style.display = 'none'; return; }
      if (!billsBox.dataset.filled) {
        billsBox.innerHTML = (subList[si].bills || []).map(function (bill) {
          return '<span class="bill-chip abnormal" data-bill="' + esc(bill) + '">' + esc(bill) + '</span>';
        }).join('');
        billsBox.dataset.filled = '1';
        billsBox.querySelectorAll('.bill-chip').forEach(function (chip) {
          chip.addEventListener('click', function (ev) { ev.stopPropagation(); openBillModal(chip.getAttribute('data-bill')); });
        });
      }
      billsBox.style.display = 'flex';
    });
  });
}

/** เกณฑ์สีตาม % ตกค้าง (สูง = แย่ = แดง, ต่ำ = ดี = เขียว) — v129: ใช้เกณฑ์เดียวกับหน้า "ตกค้างสถานะ 00" (0% / 0–5% / >5%) */
function cohortAbnormalColor(pct) {
  if (pct === 0) return 'var(--normal)';
  if (pct <= 5) return 'var(--watch)';
  return 'var(--anomaly)';
}

/** yyyy-MM-dd -> dd/MM (แสดงผลสั้นๆ ในการ์ด/ตาราง) */
function fmtDdMm(isoDateStr) {
  const p = String(isoDateStr).split('-');
  if (p.length !== 3) return isoDateStr;
  return p[2] + '/' + p[1];
}

/** yyyy-MM-dd -> dd/MM/yyyy (แสดงผลเต็มพร้อมปี ใช้ตอนบอกช่วงวันที่ที่อาจข้ามปี) */
function fmtDdMmYyyy(isoDateStr) {
  const p = String(isoDateStr).split('-');
  if (p.length !== 3) return isoDateStr;
  return p[2] + '/' + p[1] + '/' + p[0];
}

/**
 * v111: ดึงช่วงวันที่สร้างบิลที่มีข้อมูลจริง (เก่าสุด-ใหม่สุด) มาครั้งเดียว
 * ใช้ตั้ง min/max ของ date picker กันเลือกวันที่ที่ไม่มีข้อมูลเลย + โชว์ข้อความบอกช่วงไว้ข้างๆ ให้เห็นทันที
 */
function applyBillDateRangeHints() {
  jsonp(WEBAPP_URL + '?action=getBillCreatedDateRange').then(function (json) {
    if (!json.ok || !json.data || !json.data.minDate) return;
    const rangeText = 'ข้อมูล: ' + fmtDdMmYyyy(json.data.minDate) + ' - ' + fmtDdMmYyyy(json.data.maxDate);
    const headerEl = document.getElementById('headerDateRange');
    if (headerEl) {
      const timePart = json.data.maxCreatedTime ? ' เวลา ' + json.data.maxCreatedTime.substring(0, 5) + ' น.' : '';
      headerEl.textContent = 'มีข้อมูลบิลที่สร้างตั้งแต่วันที่ ' + fmtDdMmYyyy(json.data.minDate) + ' ถึงวันที่ ' + fmtDdMmYyyy(json.data.maxDate) + timePart + ' (ล่าสุด)';
    }
    [['o00Date', 'o00DateHint'], ['matrixDate', 'matrixDateHint']].forEach(function (pair) {

      if (input) { input.min = json.data.minDate; input.max = json.data.maxDate; }
      if (hint) hint.textContent = rangeText;
    });
  }).catch(function () { /* โหลดช่วงวันที่ไม่ได้ ไม่กระทบการใช้งานหลัก แค่ไม่มีตัวช่วยกันเลือกผิด */ });
}

function cohortCardTone(pct) {
  if (pct === 0) return { bg: 'var(--normal-dim)', border: 'var(--normal)', text: 'var(--normal)' };
  if (pct <= 5) return { bg: 'var(--watch-dim)', border: 'var(--watch)', text: 'var(--watch)' };
  return { bg: 'var(--anomaly-dim)', border: 'var(--anomaly)', text: 'var(--anomaly)' };
}

function buildFlowSVG(stages, stageDefs) {
  const W = 1000, H = 230;
  const marginX = 80, baseline = 168, maxBarH = 118, minBarH = 22, barW = 64;
  const maxTotal = Math.max.apply(null, stages.map(function (s) { return s.total; }).concat([1]));
  const n = stages.length;
  const stepX = (W - marginX * 2) / (n - 1);
  const pts = stages.map(function (s, i) {
    const h = s.total > 0 ? Math.max(minBarH, Math.round(maxTotal ? (s.total / maxTotal) * maxBarH : 0)) : 0;
    return { x: marginX + i * stepX, h: h, top: baseline - h, s: s };
  });

  let ribbons = '';
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const midX = (a.x + b.x) / 2;
    const topA = baseline - Math.max(a.h, 6), botA = baseline;
    const topB = baseline - Math.max(b.h, 6), botB = baseline;
    ribbons += '<path d="M ' + a.x + ' ' + topA + ' C ' + midX + ' ' + topA + ', ' + midX + ' ' + topB + ', ' + b.x + ' ' + topB +
      ' L ' + b.x + ' ' + botB + ' C ' + midX + ' ' + botB + ', ' + midX + ' ' + topA + ', ' + a.x + ' ' + botA + ' Z" fill="url(#flowGrad)" opacity="0.55"/>';
  }

  let bars = '';
  pts.forEach(function (p, i) {
    const s = p.s;
    const h = Math.max(p.h, 6);
    const redFrac = s.total > 0 ? s.red / s.total : 0;
    const redH = Math.round(h * redFrac);
    const normH = h - redH;
    const x0 = p.x - barW / 2;
    bars += '<g class="flow-bar-group" data-stage-index="' + i + '" style="cursor:pointer">';
    bars += '<rect x="' + x0 + '" y="20" width="' + barW + '" height="' + (baseline - 20) + '" fill="transparent"/>'; // hit area ทั้งคอลัมน์
    if (normH > 0) {
      bars += '<rect x="' + x0 + '" y="' + (baseline - h) + '" width="' + barW + '" height="' + normH + '" rx="6" fill="var(--normal)"/>';
      bars += '<rect x="' + x0 + '" y="' + (baseline - h) + '" width="' + barW + '" height="' + normH + '" rx="6" fill="url(#flowStripes)"/>';
    }
    if (redH > 0) {
      bars += '<rect x="' + x0 + '" y="' + (baseline - redH) + '" width="' + barW + '" height="' + redH + '" rx="6" fill="var(--anomaly)"/>';
    }
    bars += '<text x="' + p.x + '" y="' + (baseline - h - 12) + '" text-anchor="middle" class="flow-stage-count" font-size="20" fill="var(--text)">' + s.total.toLocaleString('th-TH') + '</text>';
    if (s.red > 0) {
      bars += '<circle cx="' + (p.x - 15) + '" cy="' + (baseline - h - 33) + '" r="3.5" fill="var(--anomaly)"/>';
      bars += '<text x="' + (p.x + 3) + '" y="' + (baseline - h - 30) + '" text-anchor="middle" font-size="11" fill="var(--anomaly)" font-family="var(--font-mono)">' + s.red.toLocaleString('th-TH') + '</text>';
    }
    bars += '<text x="' + p.x + '" y="' + (baseline + 26) + '" text-anchor="middle" class="flow-stage-label">' + esc(s.label) + '</text>';
    bars += '</g>';
    if (i < pts.length - 1) {
      bars += '<text x="' + (p.x + stepX / 2) + '" y="' + (baseline + 6) + '" text-anchor="middle" font-size="13" fill="var(--text-faint)">→</text>';
    }
  });

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;min-width:760px" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
    '<linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--normal)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--normal)" stop-opacity="0.12"/></linearGradient>' +
    '<pattern id="flowStripes" width="14" height="14" patternUnits="userSpaceOnUse">' +
    '<rect width="14" height="14" fill="transparent"/>' +
    '<rect x="-4" y="0" width="6" height="14" fill="rgba(255,255,255,0.35)" transform="skewX(-30)"/>' +
    '<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 0" dur="1s" repeatCount="indefinite"/>' +
    '</pattern>' +
    '</defs>' +
    ribbons + bars +
    '</svg>';
}

function histBar(count, max, color, label) {
  const h = Math.max(4, Math.round(count / max * 100));
  return '<div class="hist-bar-wrap"><div class="hist-count">' + count.toLocaleString('th-TH') + '</div>' +
    '<div class="hist-bar" style="height:' + h + '%;background:' + color + '"></div>' +
    '<div class="hist-label">' + label + '</div></div>';
}

function isStuckAtOrigin(status) {
  const code = statusCode(status);
  return code === '00' || code === '01';
}

function renderFocus() {
  const data = lastData;
  const dc = document.getElementById('focusDC').value;
  const container = document.getElementById('focusResult');
  if (!data || !dc) {
    container.innerHTML = '<div class="focus-empty">เลือก DC ต้นทางด้านบน เพื่อดูว่าบิลที่สร้างแต่ละวันยังค้างไม่ได้ขึ้นรถกี่บิล</div>';
    return;
  }
  const relevant = data.bills.filter(function (b) { return b.from === dc; });
  const byDate = {};
  relevant.forEach(function (b) {
    const key = b.createdDate || '(ไม่ทราบวันที่)';
    if (!byDate[key]) byDate[key] = { date: key, total: 0, stuck: 0, moved: 0 };
    byDate[key].total++;
    if (isStuckAtOrigin(b.status)) byDate[key].stuck++; else byDate[key].moved++;
  });
  const rows = Object.values(byDate).sort(function (a, b) { return b.date < a.date ? -1 : 1; });
  const totalStuck = relevant.filter(function (b) { return isStuckAtOrigin(b.status); }).length;

  let html = '<div class="focus-summary">' +
    '<div class="chip">บิล active ทั้งหมดจาก ' + esc(dc) + '<b>' + relevant.length.toLocaleString('th-TH') + '</b></div>' +
    '<div class="chip">ยังค้าง ไม่ได้ขึ้นรถออกจากสาขา<b style="color:var(--anomaly)">' + totalStuck.toLocaleString('th-TH') + '</b></div></div>';

  if (rows.length === 0) {
    html += '<div class="focus-empty">ไม่มีบิล active จากสาขานี้</div>';
  } else {
    html += '<div class="table-scroll" style="max-height:280px"><table><thead><tr><th>วันที่สร้างบิล</th><th class="num">บิลทั้งหมด</th><th class="num">' + ICONS.dot('var(--anomaly)') + ' ค้าง ไม่ได้ขึ้นรถ</th><th class="num">ขึ้นรถแล้ว</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td class="mono">' + esc(formatDateLabel(r.date)) + '</td><td class="num">' + r.total +
        '</td><td class="num">' + (r.stuck ? '<span class="badge red">' + r.stuck + '</span>' : '—') +
        '</td><td class="num">' + r.moved + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  container.innerHTML = html;
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function yesterdayISO() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function formatDateLabel(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
  const [y, m, d] = iso.split('-');
  return d + '/' + m + '/' + y;
}

let stageFilter = null; // { test: function(code), label: string } — ตั้งจากการคลิกแท่งในกราฟ flow

function renderBillTable() {
  const data = lastData;
  if (!data) return;
  const search = document.getElementById('searchBill').value.trim();
  const dcF = document.getElementById('filterDC').value;
  const riskF = document.getElementById('filterRisk').value;

    if (search && b.bill.indexOf(search) === -1) return false;

  document.getElementById('tableCount').innerHTML = countLabel;

  document.getElementById('billBody').innerHTML = filtered.slice(0, 400).map(function (b) {
    const bm = badgeMap[b.risk] || badgeMap[''];
    return '<tr><td class="mono">' + esc(b.bill) + '</td><td>' + esc(dcDisplayName(b.from)) + '</td><td>' + esc(dcDisplayName(b.to)) + '</td><td>' +
      esc(dcDisplayName(b.dc)) + '</td><td>' + esc(friendlyStatus(b.status)) + '<div class="sub">' + esc(b.status) + '</div></td><td class="mono">' + esc(b.due || '—') + '</td><td><span class="badge ' +

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dcDisplayName(name) { return String(name || '').replace(/^\s*\S*\d\S*\s+/, '').trim() || name; }

/** v115: สร้างข้อความสรุปตกค้างสถานะ 00 แบบข้อความล้วน (ไม่มี HTML) สำหรับคัดลอกไปวางในไลน์กลุ่ม */
function generateOrigin00ReportText() {
  const data = lastOrigin00Data;
  const list = lastOrigin00SortedList;
  if (!data || !list || list.length === 0) return 'ยังไม่มีข้อมูลให้สรุป';

  function pctOf(d) {
    const denom = d.createdCohort || d.total;
    return denom ? (d.stuck / denom * 100) : 0;
  }
  function getBand(d) {
    const v = pctOf(d);
    if (d.stuck === 0) return 2;
    if (v <= 5) return 1;
    return 0;
  }
  const bands = [[], [], []];
  list.forEach(function (d) { bands[getBand(d)].push(d); });
  bands.forEach(function (b) { b.sort(function (x, y) { return (pctOf(y) - pctOf(x)) || (y.stuck - x.stuck); }); });

  const totalStuck = list.reduce(function (s, d) { return s + d.stuck; }, 0);
  const totalDenom = list.reduce(function (s, d) { return s + (d.createdCohort || d.total); }, 0); // v121: ฐานเดียวกับ % รายสาขา (ยอดสร้างทั้งหมด) ไม่ใช่ยอดค้างตอนนี้
  const overallPct = totalDenom ? Math.round(totalStuck / totalDenom * 100) : 0;
  const billTypeLabel = o00CurrentBillType === 'AB' ? ' (NORMAL)' : (o00CurrentBillType === 'CC' ? ' (COLDCHAIN)' : '');
  const periodLabel = data.mode === 'all' ? 'สะสมทั้งหมด' : formatDateLabel(data.cohortDate);
  const REPORT_TOP_N = 15; // จำกัดจำนวนสาขาที่ลิสต์เต็มในกลุ่มแดง กันข้อความยาวเกินไปตอนมีปัญหาเยอะพร้อมกัน

  const lines = [];
  lines.push('📦 ตกค้าง 00 — ' + periodLabel + billTypeLabel);
  lines.push(overallPct + '% ตกค้าง (' + totalStuck.toLocaleString('th-TH') + '/' + totalDenom.toLocaleString('th-TH') + ' บิลที่เคยสร้าง) จาก ' + list.length + ' สาขา');
  lines.push('');

  if (bands[0].length > 0) {
    lines.push('🔴 ตกค้างมาก (' + bands[0].length + ' สาขา)');
    bands[0].slice(0, REPORT_TOP_N).forEach(function (d, i) {
      lines.push((i + 1) + '. ' + dcDisplayName(d.dc) + ' ' + Math.round(pctOf(d)) + '% (' + d.stuck + ' บิล)');
    });
    if (bands[0].length > REPORT_TOP_N) lines.push('…และอีก ' + (bands[0].length - REPORT_TOP_N) + ' สาขา');
    lines.push('');
  }
  lines.push('🟡 เล็กน้อย ' + bands[1].length + ' สาขา  |  🔵 ไม่ตกค้าง ' + bands[2].length + ' สาขา');

  return lines.join('\n');
}

function excelDateToJS(v) {
  if (v instanceof Date) return v;
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400 * 1000));
  return null;
}
function timeOfDayU(v) {
  // คำนวณตรงจากเลขเศษส่วนวันของ Excel (fraction of a day) ด้วยเลขคณิตล้วนๆ
  // ไม่ผ่าน Date object เลย กัน bug เขตเวลาประวัติศาสตร์ของ SheetJS/เบราว์เซอร์
  // (วันฐาน 30 ธ.ค. 1899 ของ Excel ตกอยู่ในยุคที่เขตเวลากรุงเทพฯ ยังไม่เป็น UTC+7 พอดี
  //  ทำให้แปลงผ่าน Date ได้ค่าเพี้ยนไปประมาณ 17 นาที 56 วินาทีทุกครั้ง)
  if (typeof v === 'number') {
    const totalSec = Math.round((v % 1) * 86400);
    return { h: Math.floor(totalSec / 3600), m: Math.floor((totalSec % 3600) / 60), s: totalSec % 60 };
  }
  if (v instanceof Date) return { h: v.getUTCHours(), m: v.getUTCMinutes(), s: v.getUTCSeconds() };
  if (typeof v === 'string') {
    const m = v.match(/(\d{1,2}):(\d{2}):(\d{2})/);
    if (m) return { h: parseInt(m[1], 10), m: parseInt(m[2], 10), s: parseInt(m[3], 10) };
  }
  return null;
}
function formatTimeStr(v) {
  // แปลงค่าจาก Excel (เลขเศษส่วนวัน, Date object เก่า, หรือ string) ให้เป็น "HH:mm:ss" สะอาดๆ
  // คำนวณจากเลขดิบตรงๆ ไม่ผ่าน Date object เลย กันปัญหาเขตเวลาประวัติศาสตร์เพี้ยน ~17:56 นาที
  if (v === null || v === undefined || v === '') return '';
  const pad = function (n) { return String(n).padStart(2, '0'); };
  if (typeof v === 'number') {
    const t = timeOfDayU(v);
    return pad(t.h) + ':' + pad(t.m) + ':' + pad(t.s);
  }
  if (v instanceof Date) {
    return pad(v.getUTCHours()) + ':' + pad(v.getUTCMinutes()) + ':' + pad(v.getUTCSeconds());
  }
  return String(v);
}
function combineDateTime(dateObj, t) {
  if (!dateObj) return '';
  // ใช้ Date.UTC ตรงๆ กันปัญหา timezone เพี้ยน (new Date(y,m,d,h) แบบ local แล้วค่อย toISOString จะเลื่อนตาม timezone เครื่อง)
  const ms = Date.UTC(dateObj.getUTCFullYear(), dateObj.getUTCMonth(), dateObj.getUTCDate(), t ? t.h : 0, t ? t.m : 0, t ? t.s : 0);
  return new Date(ms).toISOString();
}
function toIsoU(d) {
  if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '';
  return d.toISOString().slice(0, 10);
}
function parseThaiDateU(s) {
  if (!s || typeof s !== 'string') return null;
  const parts = s.trim().split('/');
  if (parts.length !== 3) return null;
  let [d, m, y] = parts.map(x => parseInt(x, 10));
  if (y > 2400) y -= 543;
  return new Date(y, m - 1, d);
}

async function pollImportResult(batchId, maxWaitMs) {
  const start = Date.now();
  while (Date.now() - start < maxWaitMs) {
    try {
      const res = await jsonp(WEBAPP_URL + '?action=getImportResult&batchId=' + encodeURIComponent(batchId));
      if (res.ok && res.ready) return res.result;
    } catch (e) { /* เงียบไว้ ลองใหม่รอบถัดไป */ }
    await new Promise(function (r) { setTimeout(r, 2000); });
  }
  return null;
}

const dropZoneU = document.getElementById('dropZone');
const fileInputU = document.getElementById('fileInput');
const uploadLog = document.getElementById('uploadLog');
const uploadBanner = document.getElementById('uploadSummaryBanner');
const uploadSummaryText = document.getElementById('uploadSummaryText');

let uFilesInFlight = 0, uFilesOk = 0, uFilesTotal = 0;
let uGrandTotal = { new: 0, changed: 0, unchanged: 0, delivered: 0, skippedAlreadyArchived: 0 };

['dragover', 'dragenter'].forEach(ev => dropZoneU.addEventListener(ev, e => { e.preventDefault(); dropZoneU.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => dropZoneU.addEventListener(ev, e => { dropZoneU.classList.remove('drag'); }));
dropZoneU.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer.files.length) handleUploadFiles(e.dataTransfer.files); });
fileInputU.addEventListener('change', function (e) { if (e.target.files.length) handleUploadFiles(e.target.files); fileInputU.value = ''; });

function handleUploadFiles(fileList) {
  uploadBanner.classList.remove('show');
  const files = Array.from(fileList);
  uFilesTotal += files.length;
  uFilesInFlight += files.length;
  // v120: ประมวลผลทีละไฟล์ตามลำดับ (รอไฟล์ก่อนหน้าเสร็จก่อนเริ่มไฟล์ถัดไป) กัน race condition ตอนหลาย
  // execution เขียน Google Sheet พร้อมกัน — Apps Script มี LockService กันไว้อีกชั้นแล้วก็จริง แต่ยิง
  // ทีละไฟล์ตั้งแต่ต้นทางเลยจะไม่มีใครต้องรอ lock เปล่าๆ ด้วย
  uploadFilesSequentially(files);
}

async function uploadFilesSequentially(files) {
  for (let i = 0; i < files.length; i++) {
    await processUploadFile(files[i]);
  }
}

function processUploadFile(file) {
  return new Promise(function (resolve) {
    const lineId = 'ulog_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const card = document.createElement('div');
    card.className = 'u-card pending';
    card.id = lineId;
    card.innerHTML = '<div class="file"><span class="u-spinner"></span>' + esc(file.name) + '</div><div class="status-text">กำลังอ่านไฟล์...</div>';
    uploadLog.prepend(card);

    const reader = new FileReader();
    reader.onload = function (ev) {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: false });
        const sheetName = wb.SheetNames.includes('DATA') ? 'DATA' : wb.SheetNames[0];
        const json = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
        const rows = json.map(function (r) {
          const due = parseThaiDateU(r['วันที่กำหนดส่ง']);
          const pulledDateObj = excelDateToJS(r['วันที่ดึงสถานะ']);
          return {
            bill: String(r['เลขที่บิล'] || ''),
            status: r['สถานะบิล'] || '',
            pulledDate: toIsoU(pulledDateObj),
            pulledTime: formatTimeStr(r['เวลาดึงสถานะ']),
            pulledAt: combineDateTime(pulledDateObj, timeOfDayU(r['เวลาดึงสถานะ'])),
            from: r['DCต้นทาง'] || r['DC ต้นทาง'] || '',
            to: r['DCปลายทาง'] || r['DC ปลายทาง'] || '',
            current: r['DC ปัจจุบัน'] || '',
            billType: r['ประเภทบิล'] || '',
            createdDate: toIsoU(excelDateToJS(r['วันที่สร้างบิล'])),
            createdTime: formatTimeStr(r['เวลาสร้างบิล']),
            dueDate: toIsoU(due)
          };
        }).filter(function (r) { return r.bill; });

        if (rows.length === 0) {
          setUCardError(lineId, 'ไม่พบข้อมูลบิลในไฟล์นี้ (เช็คว่ามี sheet "DATA" หรือเปล่า)');
          uFileDone(false);
          resolve();
          return;
        }

        const batchId = 'b_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        setUCardPending(lineId, 'กำลังส่ง ' + rows.length.toLocaleString('th-TH') + ' บิลเข้า Google Sheet...');

        fetch(WEBAPP_URL, {
          method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'import', batchId: batchId, rows: rows })
        }).then(function () {
          setUCardPending(lineId, 'ส่งแล้ว กำลังรอผลจาก Google Sheet... (ไฟล์ใหญ่อาจใช้เวลาสักครู่)');
          const waitMs = Math.min(240000, Math.max(20000, rows.length * 1.5));
          return pollImportResult(batchId, waitMs);
        }).then(function (result) {
          if (!result) {
            setUCardError(lineId, 'ส่งข้อมูลไปแล้ว แต่รอผลนานเกินไป — เช็คใน Google Sheet ได้เลยว่าข้อมูลเข้าจริงไหม');
            uFileDone(false);
            resolve();
            return;
          }
          setUCardOk(lineId, result);
          uGrandTotal.new += result.new; uGrandTotal.changed += result.changed;
          uGrandTotal.unchanged += result.unchanged; uGrandTotal.delivered += result.delivered;
          uGrandTotal.skippedAlreadyArchived += (result.skippedAlreadyArchived || 0);
          uFileDone(true);
          resolve();
        }).catch(function (err) { setUCardError(lineId, 'ส่งข้อมูลไม่สำเร็จ: ' + err.message); uFileDone(false); resolve(); });
      } catch (err) { setUCardError(lineId, 'อ่านไฟล์ไม่สำเร็จ: ' + err.message); uFileDone(false); resolve(); }
    };
    reader.readAsArrayBuffer(file);
  });
}

function uFileDone(ok) {
  uFilesInFlight--;
  if (ok) uFilesOk++;
  if (uFilesInFlight <= 0) {
    if (uFilesOk > 0) {
      uploadSummaryText.textContent = 'อัปโหลด ' + uFilesOk.toLocaleString('th-TH') + '/' + uFilesTotal.toLocaleString('th-TH') + ' ไฟล์สำเร็จ — บิลใหม่ ' +
        uGrandTotal.new.toLocaleString('th-TH') + ', เปลี่ยนสถานะ ' + uGrandTotal.changed.toLocaleString('th-TH') + ', ส่งสำเร็จ ' + uGrandTotal.delivered.toLocaleString('th-TH');
      uploadBanner.classList.add('show');
      // v105: ดึงยอดรวมทะเบียนจริงจาก Sheet มาแปะต่อท้าย เพื่อเช็คความครบถ้วนหลัง import
      jsonp(WEBAPP_URL + '?action=getRegistryTotals').then(function (res) {
        if (res && res.ok) {
          const d = res.data;
          uploadSummaryText.textContent += ' | ยอดรวมทั้งระบบตอนนี้: ค้าง ' + d.activeBills.toLocaleString('th-TH') +
            ' + ส่งแล้วสะสม ' + d.deliveredBills.toLocaleString('th-TH') +
            ' + ยกเลิก ' + d.cancelledBills.toLocaleString('th-TH') +
            ' = ' + d.totalKnownBills.toLocaleString('th-TH') + ' บิล';
        }
      }).catch(function () { /* เช็คไม่ได้ไม่เป็นไร ตัวเลขต่อไฟล์ด้านบนยังใช้ได้ */ });
      loadDashboard(); // รีเฟรช dashboard อัตโนมัติหลังอัปโหลดเสร็จ
    }
  }
}

function setUCardPending(id, text) {
  const el = document.getElementById(id); if (!el) return;
  const fileName = el.querySelector('.file').textContent;
  el.className = 'u-card pending';
  el.innerHTML = '<div class="file"><span class="u-spinner"></span>' + esc(fileName) + '</div><div class="status-text">' + esc(text) + '</div>';
}
function setUCardOk(id, result) {
  const el = document.getElementById(id); if (!el) return;
  const fileName = el.querySelector('.file').textContent;
  el.className = 'u-card ok';
  let html = '<div class="file">' + ICONS.check + ' ' + esc(fileName) + '</div><div class="status-text">เก็บข้อมูลครบแล้ว (' + result.total.toLocaleString('th-TH') + ' แถว)</div>';
  html += '<div class="u-stats"><span class="u-chip">บิล unique ในไฟล์ <b>' + (result.uniqueBillsInFile || 0).toLocaleString('th-TH') + '</b></span>' +
    '<span class="u-chip">ใหม่ <b>' + result.new.toLocaleString('th-TH') + '</b></span>' +
    '<span class="u-chip">เปลี่ยนสถานะ <b>' + result.changed.toLocaleString('th-TH') + '</b></span>' +
    '<span class="u-chip">ไม่เปลี่ยน <b>' + result.unchanged.toLocaleString('th-TH') + '</b></span>' +
    '<span class="u-chip">ส่งสำเร็จ <b>' + result.delivered.toLocaleString('th-TH') + '</b></span>' +
    (result.skippedAlreadyArchived ? '<span class="u-chip">ข้าม(ซ้ำ) <b>' + result.skippedAlreadyArchived.toLocaleString('th-TH') + '</b></span>' : '') +
    (result.staleSkipped ? '<span class="u-chip" style="color:var(--watch)" title="แถวนี้เก่ากว่าข้อมูลที่มีอยู่แล้ว ไม่เอาไปทับสถานะปัจจุบัน (RawLog ยังบันทึกไว้ตามปกติ)">ข้าม(เก่ากว่า) <b>' + result.staleSkipped.toLocaleString('th-TH') + '</b></span>' : '') +
    (result.duplicateEventSkipped ? '<span class="u-chip" style="color:var(--watch)" title="เหตุการณ์นี้ (บิล+สถานะ+เวลาที่ดึง) เคยถูกบันทึกลง RawLog ไปแล้ว ไม่เขียนซ้ำอีก">ข้าม(ซ้ำใน RawLog) <b>' + result.duplicateEventSkipped.toLocaleString('th-TH') + '</b></span>' : '') + '</div>';
  el.innerHTML = html;
}
function setUCardError(id, text) {
  const el = document.getElementById(id); if (!el) return;
  const fileName = el.querySelector('.file').textContent;
  el.className = 'u-card error';
  el.innerHTML = '<div class="file">' + ICONS.warn + ' ' + esc(fileName) + '</div><div class="status-text">' + esc(text) + '</div>';
}
